name: Repair History Navigation

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.event.head_commit.message != 'Repair history dashboard navigation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add dashboard navigation
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/dashboard/history/page.tsx')
          s = p.read_text()
          old = '<button onClick={close} className="inline-flex items-center gap-2 font-bold text-slate-600"><ArrowLeft size={17}/> Back to History</button>'
          new = '<div className="flex flex-wrap items-center gap-3"><a href={`${BASE}/dashboard/`} className="inline-flex items-center gap-2 rounded-2xl bg-ink px-4 py-2.5 text-sm font-black text-white shadow"><ArrowLeft size={17}/> Dashboard</a><button onClick={close} className="inline-flex items-center gap-2 rounded-2xl border border-slate-200 bg-white px-4 py-2.5 text-sm font-black text-slate-600"><ArrowLeft size={17}/> Back to History</button></div>'
          if old not in s:
              raise SystemExit('Target navigation markup not found')
          p.write_text(s.replace(old, new, 1))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/dashboard/history/page.tsx
          git commit -m 'Repair history dashboard navigation'
          git push
      - name: Remove repair workflow
        run: |
          git rm .github/workflows/repair-history-navigation.yml
          git commit -m 'Remove temporary history repair workflow'
          git push
