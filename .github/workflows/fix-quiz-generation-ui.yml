name: Repair quiz generation loading UI

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch quiz generation loading state
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/dashboard/quiz/page.tsx')
          text = p.read_text()

          old = " if(setup&&!qs.length)return <main className=\"grid min-h-screen place-items-center bg-gradient-to-br from-slate-50 via-white to-cyan-50 p-6\"><section className=\"w-full max-w-md rounded-[2rem] bg-white p-8 text-center shadow-2xl\"><div className=\"mx-auto grid h-16 w-16 place-items-center rounded-2xl bg-gradient-to-br from-indigo-500 to-cyan-400 text-white\">{generationError?<Sparkles size={30}/>:<Loader2 className=\"animate-spin\" size={30}/>}</div><h1 className=\"mt-5 text-2xl font-black\">{generationError?'Quiz generation needs another try':'Building your quiz…'}</h1><p className=\"mt-3 text-sm leading-6 text-slate-500\">{generationError||generationStatus||'EDUWILLS is preparing your questions.'}</p>{generationError?<div className=\"mt-6 flex gap-3\"><button onClick={reset} className=\"flex-1 rounded-xl border py-3 font-black\">Back</button><button onClick={()=>{reset();setTimeout(start,50)}} className=\"flex-1 rounded-xl bg-ink py-3 font-black text-white\">Try again</button></div>:<div className=\"mt-6 h-2 overflow-hidden rounded-full bg-slate-100\"><div className=\"h-full w-2/3 animate-pulse rounded-full bg-gradient-to-r from-indigo-500 to-cyan-400\"/></div>}</section></main>;"

          if old not in text:
              raise SystemExit('Expected quiz generation block was not found; refusing to make a blind edit.')

          new = " if((busy||generationStatus||generationError)&&!setup)return <main className=\"grid min-h-screen place-items-center bg-gradient-to-br from-slate-50 via-white to-cyan-50 p-6\"><section className=\"w-full max-w-md rounded-[2rem] border border-slate-100 bg-white p-8 text-center shadow-2xl\"><div className=\"mx-auto grid h-16 w-16 place-items-center rounded-2xl bg-gradient-to-br from-indigo-500 to-cyan-400 text-white shadow-lg\">{generationError?<Sparkles size={30}/>:<Loader2 className=\"animate-spin\" size={30}/>}</div><h1 className=\"mt-5 text-2xl font-black text-slate-900\">{generationError?'Quiz generation needs another try':'Building your quiz…'}</h1><p className=\"mt-3 text-sm leading-6 text-slate-500\">{generationError||generationStatus||'EDUWILLS is preparing your questions.'}</p>{generationError?<div className=\"mt-6 flex gap-3\"><button onClick={reset} className=\"flex-1 rounded-xl border border-slate-200 py-3 font-black text-slate-700\">Back</button><button onClick={()=>{reset();setTimeout(start,50)}} className=\"flex-1 rounded-xl bg-ink py-3 font-black text-white\">Try again</button></div>:<><div className=\"mt-6 h-2 overflow-hidden rounded-full bg-slate-100\"><div className=\"h-full w-2/3 animate-pulse rounded-full bg-gradient-to-r from-indigo-500 to-cyan-400\"/></div><p className=\"mt-4 text-xs font-bold text-slate-400\">Please keep this page open while EDUWILLS researches the book and builds your questions.</p></>}</section></main>;"
          p.write_text(text.replace(old, new, 1))
          PY

      - name: Commit repair and remove this one-time workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/dashboard/quiz/page.tsx .github/workflows/fix-quiz-generation-ui.yml
          git rm .github/workflows/fix-quiz-generation-ui.yml
          git commit -m "Fix quiz generation loading and error interface"
          git push origin main
