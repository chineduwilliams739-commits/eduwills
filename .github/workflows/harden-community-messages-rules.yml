name: Harden Community Messaging Rules
on:
  push:
    branches: [main]
    paths:
      - 'scripts/harden-community-messages-rules.mjs'
      - '.github/workflows/harden-community-messages-rules.yml'
  workflow_dispatch:
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/harden-community-messages-rules.mjs
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add firestore.rules
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Allow secure group messaging'
          git push
