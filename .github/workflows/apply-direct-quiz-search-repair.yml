name: Apply direct quiz and search repair

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-direct-quiz-search-repair.yml'
      - 'lib/quizAiClient.ts'
      - 'app/dashboard/quiz/page.tsx'

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, '[direct-repair]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch the actual quiz/search implementation
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path('lib/quizAiClient.ts')
          s = path.read_text()

          s = s.replace("const CACHE_VERSION = 'v6-content-first';", "const CACHE_VERSION = 'v7-direct-content-engine';")

          anchor = "const remarksModel = getGenerativeModel(ai, { model: 'gemini-3.5-flash-lite', generationConfig: { temperature: 0.45, maxOutputTokens: 220 } });"
          research_model = anchor + "\nconst researchModel = getGenerativeModel(ai, { model: 'gemini-3.6-flash', generationConfig: { temperature: 0.2, maxOutputTokens: 6000 }, tools: [{ googleSearch: {} }] });"
          if 'const researchModel =' not in s:
              s = s.replace(anchor, research_model)

          old = "if(scarsQuery){ const exact={title:'SCARS: Nigeria’s Journey and the Boko Haram Conundrum',authors:['Gen. Lucky Irabor'],source:'EDUWILLS verified catalogue'}; results.push(exact); seen.add(normalize(exact.title)+'|'+normalize(exact.authors[0])); if(kind==='author'&&key.includes('irabor')){ storageSet(cacheKey('search',{kind,key}),results,SEARCH_TTL); return results; } }"
          new = "if(scarsQuery){ const exact={title:'SCARS: Nigeria’s Journey and the Boko Haram Conundrum',authors:['Gen. Lucky Irabor'],source:'EDUWILLS verified catalogue'}; storageSet(cacheKey('search',{kind,key}),[exact],SEARCH_TTL); return [exact]; }"
          if old not in s:
              raise SystemExit('SCARS search block not found')
          s = s.replace(old, new)

          research_anchor = "for(const book of books)for(const fact of curated[normalize(book.title)]||[])pushUnique(chunks,`EDUWILLS verified catalogue: ${fact}`);"
          grounded_block = research_anchor + "\n  for(const book of books){ try { const prompt=`Research the exact book \"${book.title}\" by ${book.author} for an academic quiz. Use Google Search grounding and distinguish this exact book from similarly named works. Return a dense factual study dossier with concrete, verifiable details from the book and reliable sources: chapter-by-chapter facts, named people or characters, places, dates and years, numbers/statistics, specific events/incidents, chronology, decisions, conflicts, causes/effects, policies/responses, quotations only when safely verified, and the author's arguments or conclusions. Do not fill gaps with guesses. This dossier will be used to write factual multiple-choice questions, so prioritize details that can become unambiguous questions. Include source names or URLs when available.`; const r=await withTimeout(researchModel.generateContent(prompt),45000); const text=r.response.text().trim(); if(text) pushUnique(chunks,`Gemini grounded research (${book.title}): ${text}`); } catch {} }"
          if 'Gemini grounded research' not in s:
              if research_anchor not in s:
                  raise SystemExit('Research anchor not found')
              s = s.replace(research_anchor, grounded_block)

          old_fn = "function isContentQuestion(q:string){return !metadataPattern.test(q)||/\\b(character|event|chapter|date|year|place|incident|scene|decision|relationship|conflict|policy|battle|attack|meeting|death|born|appointed|served|occurred|happened)\\b/i.test(q)}"
          new_fn = "function isSubstantiveQuestion(q:string,evidence:string){const text=`${q} ${evidence}`;if(genericPattern.test(q))return false;if(metadataPattern.test(q)&&!/\\b(character|event|chapter|date|year|place|incident|scene|decision|relationship|conflict|policy|battle|attack|meeting|death|born|appointed|served|occurred|happened|named|number|sequence|before|after)\\b/i.test(q))return false;const concrete=/\\b(character|event|incident|chapter|date|year|place|decision|relationship|conflict|policy|battle|attack|meeting|death|born|appointed|served|occurred|happened|number|percent|million|thousand|part|section)\\b/i.test(text)||/\\b(19|20)\\d{2}\\b|\\b\\d+(?:\\.\\d+)?%?\\b/.test(text);if(!concrete)return false;const qWords=new Set(normalize(q).split(' ').filter(w=>w.length>4));const eWords=new Set(normalize(evidence).split(' ').filter(w=>w.length>4));const overlap=[...qWords].filter(w=>eWords.has(w)).length;return overlap>=1||/\\b(19|20)\\d{2}\\b/.test(evidence)||/\\b\\d+(?:\\.\\d+)?%?\\b/.test(evidence)}"
          if old_fn not in s:
              raise SystemExit('Old content classifier not found')
          s = s.replace(old_fn, new_fn)
          s = s.replace('isContentQuestion(q.question)', "isSubstantiveQuestion(q.question,q.evidence||'')")
          s = s.replace('isContentQuestion(x.question)', "isSubstantiveQuestion(x.question,x.evidence||'')")
          s = s.replace('isContentQuestion(q.question)', "isSubstantiveQuestion(q.question,q.evidence||'')")

          path.write_text(s)
          print('Patched lib/quizAiClient.ts')
          PY

      - name: Verify direct repair
        run: |
          grep -q "v7-direct-content-engine" lib/quizAiClient.ts
          grep -q "Gemini grounded research" lib/quizAiClient.ts
          grep -q "isSubstantiveQuestion" lib/quizAiClient.ts
          grep -q "Gen. Lucky Irabor" lib/quizAiClient.ts
          echo "Direct quiz/search repair verified in source."

      - name: Commit repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/quizAiClient.ts
          git diff --cached --quiet && echo 'No source changes needed.' && exit 0
          git commit -m 'Apply direct quiz/search content engine repair [direct-repair]'
          git push origin HEAD:main
