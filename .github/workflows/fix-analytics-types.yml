name: Fix Analytics TypeScript

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fix analytics tuple typing
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/admin/analytics/page.tsx')
          s = p.read_text(encoding='utf-8')
          old = 'CATEGORIES.map(c => [c, categoryMap[c] || 0]).sort((a, b) => b[1] - a[1])'
          new = 'CATEGORIES.map(c => [c, categoryMap[c] || 0] as [string, number]).sort((a, b) => b[1] - a[1])'
          if old in s:
              p.write_text(s.replace(old, new), encoding='utf-8')
              print('Analytics tuple typing fixed.')
          else:
              print('Analytics tuple typing already fixed or source changed; no edit needed.')
          PY

      - name: Commit and push if changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/admin/analytics/page.tsx
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
          else
            git commit -m 'fix analytics TypeScript tuple typing'
            git push
          fi
