name: Deploy EduWills Brevo Email Worker

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/switch-to-brevo-email.yml'
      - 'workers/payments/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Wrangler
        run: npm install -g wrangler

      - name: Authenticate Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: wrangler whoami

      - name: Configure Brevo and required Worker secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PAYSTACK_SECRET_KEY: ${{ secrets.PAYSTACK_SECRET_KEY }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          BREVO_FROM_EMAIL: ${{ secrets.BREVO_FROM_EMAIL }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_EDUWILLS }}
        working-directory: workers/payments
        run: |
          set -euo pipefail
          test -n "$PAYSTACK_SECRET_KEY"
          test -n "$BREVO_API_KEY"
          test -n "$BREVO_FROM_EMAIL"
          test -n "$FIREBASE_SERVICE_ACCOUNT_JSON"
          printf '%s' "$PAYSTACK_SECRET_KEY" | wrangler secret put PAYSTACK_SECRET_KEY
          printf '%s' "$BREVO_API_KEY" | wrangler secret put BREVO_API_KEY
          printf '%s' "$BREVO_FROM_EMAIL" | wrangler secret put BREVO_FROM_EMAIL
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" | wrangler secret put FIREBASE_SERVICE_ACCOUNT_JSON

      - name: Deploy payment Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: workers/payments
        run: |
          set -euo pipefail
          wrangler deploy

      - name: Verify live Worker health
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: workers/payments
        run: |
          set -euo pipefail
          wrangler deployments list --json > "$RUNNER_TEMP/deployments.json"
          URL="$(node -e 'const fs=require("fs");const s=fs.readFileSync(process.argv[1],"utf8");const m=s.match(/https:\/\/[A-Za-z0-9-]+\.[A-Za-z0-9-]+\.workers\.dev/g);console.log(m?.at(-1)||"")' "$RUNNER_TEMP/deployments.json")"
          test -n "$URL"
          echo "Worker URL: $URL"
          HEALTH="$(curl --fail --silent --show-error --max-time 20 "$URL/health")"
          echo "$HEALTH"
          node -e 'const d=JSON.parse(process.argv[1]);if(d.ok!==true)process.exit(1);if(d.paystackConfigured!==true)process.exit(2);if(d.firebaseConfigured!==true)process.exit(3);' "$HEALTH"
