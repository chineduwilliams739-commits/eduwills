name: Apply Payment Activation V2 Repair

on:
  push:
    branches: [main]
    paths:
      - 'scripts/repair-payment-activation-v2.mjs'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply repair
        run: node scripts/repair-payment-activation-v2.mjs
      - name: Verify repair
        run: |
          grep -q 'PAYMENT_ACTIVATION_V2_REPAIR' workers/payments/src/index.js
          grep -q "url.pathname==='/redeem'" workers/payments/src/index.js
          grep -q 'PAYMENT_ACTIVATION_V2_UI_REPAIR' app/dashboard/activation/page.tsx
          grep -q 'Copy WilliToken' app/dashboard/activation/page.tsx
      - name: Commit repaired files
        run: |
          if git diff --quiet; then
            echo 'No changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add workers/payments/src/index.js app/dashboard/activation/page.tsx
          git commit -m 'Fix payment activation and WilliToken redemption UI'
          git push origin HEAD:main
