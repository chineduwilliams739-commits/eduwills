name: Repair Quiz Search Live

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply quiz repair
        run: node scripts/repair-dashboard-session.mjs
      - name: Commit repaired source
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/dashboard/quiz/page.tsx lib/quizAiClientStable.ts app/dashboard/page.tsx app/dashboard/activation/page.tsx scripts/repair-dashboard-session.mjs
          if git diff --cached --quiet; then
            echo 'No repair changes needed.'
            exit 0
          fi
          git commit -m 'fix: deploy reliable quiz search and instruction grounding'
          git push
