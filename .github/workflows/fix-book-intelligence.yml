name: Fix Book Intelligence

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply book intelligence fixes
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          stable = Path('lib/quizAiClientStable.ts')
          s = stable.read_text()
          s = s.replace("const CACHE_VERSION = 'v30-explanation-timer-gateway-first';", "const CACHE_VERSION = 'v31-book-intelligence-instructions-cache-first';")
          s = s.replace("ai-gateway.json?v=30", "ai-gateway.json?v=31")

          search_re = re.compile(r"export async function searchBookAuthors[\\s\\S]*?\\n}\\n\\nexport async function researchBooks", re.M)
          search_new = '''export async function searchBookAuthors(kind: 'title' | 'author', value: string): Promise<BookSearchResult[]> {
            const query = value.trim();
            if (!query) return [];
            const encoded = encodeURIComponent(query);
            const urls = kind === 'title'
              ? [
                  `https://openlibrary.org/search.json?title=${encoded}&limit=50&fields=title,author_name,key`,
                  `https://www.googleapis.com/books/v1/volumes?q=intitle:${encoded}&maxResults=40`,
                  `https://archive.org/advancedsearch.php?q=title:(${encoded})&fl[]=title&fl[]=creator&rows=40&page=1&output=json`,
                ]
              : [
                  `https://openlibrary.org/search.json?author=${encoded}&limit=50&fields=title,author_name,key`,
                  `https://www.googleapis.com/books/v1/volumes?q=inauthor:${encoded}&maxResults=40`,
                  `https://archive.org/advancedsearch.php?q=creator:(${encoded})&fl[]=title&fl[]=creator&rows=40&page=1&output=json`,
                ];
            const output: BookSearchResult[] = [];
            const seen = new Set<string>();
            await Promise.allSettled(urls.map(async (url) => {
              try {
                const response = await fetch(url, { cache: 'no-store' });
                if (!response.ok) return;
                const data: any = await response.json();
                const rows = [
                  ...(data.docs || []),
                  ...(data.items || []).map((item: any) => ({ title: item.volumeInfo?.title, author_name: item.volumeInfo?.authors })),
                  ...(data.response?.docs || []),
                ];
                for (const row of rows) {
                  const title = clean(row?.title);
                  const rawAuthors = row?.author_name ?? row?.authors ?? row?.creator ?? row?.author;
                  const authors = Array.isArray(rawAuthors)
                    ? rawAuthors.map(clean).filter(Boolean)
                    : typeof rawAuthors === 'string'
                      ? rawAuthors.split(/;|,|\\|/).map(clean).filter(Boolean)
                      : [];
                  if (!title || !authors.length) continue;
                  const key = `${norm(title)}|${authors.map(norm).join('|')}`;
                  if (seen.has(key)) continue;
                  seen.add(key);
                  output.push({ title, authors, source: url.includes('openlibrary') ? 'Open Library' : url.includes('googleapis') ? 'Google Books' : 'Internet Archive' });
                }
              } catch {}
            }));
            return output.slice(0, 160);
          }

          export async function researchBooks'''
          s, n = search_re.subn(search_new, s, count=1)
          if n != 1:
            raise SystemExit('searchBookAuthors replacement failed')

          research_re = re.compile(r"export async function researchBooks[\\s\\S]*?\\n}\\n\\nfunction promptFor", re.M)
          research_new = '''export async function researchBooks(books: QuizBook[]): Promise<string> {
            if (!books.length) return '';
            const chunks: string[] = [];
            const curated = curatedFor(books);
            if (curated) chunks.push(`VERIFIED EDUWILLS BOOK KNOWLEDGE:\\n${curated}`);
            await Promise.all(books.map(async (book) => {
              const title = encodeURIComponent(book.title);
              const author = encodeURIComponent(book.author);
              const urls = [
                `https://www.googleapis.com/books/v1/volumes?q=intitle:${title}+inauthor:${author}&maxResults=20`,
                `https://openlibrary.org/search.json?title=${title}&author=${author}&limit=30&fields=title,author_name,first_sentence,subject,description,first_publish_year,publisher`,
                `https://archive.org/advancedsearch.php?q=title:(${title})%20AND%20creator:(${author})&fl[]=title&fl[]=creator&fl[]=description&fl[]=subject&fl[]=date&rows=20&page=1&output=json`,
              ];
              const results = await Promise.allSettled(urls.map((url) => fetch(url, { cache: 'no-store' }).then((response) => response.ok ? response.json() : null)));
              for (const result of results) {
                if (result.status !== 'fulfilled' || !result.value) continue;
                const data: any = result.value;
                for (const item of data.items || []) {
                  const info = item.volumeInfo || {};
                  if (info.title || info.authors || info.description) chunks.push(`CATALOGUE: ${info.title || book.title} by ${(info.authors || [book.author]).join(', ')}. ${info.description || ''} Subjects: ${(info.categories || []).join(', ')}`);
                }
                for (const item of data.docs || []) {
                  if (item.first_sentence) chunks.push(`BOOK FIRST SENTENCE: ${(item.first_sentence || []).join(' ')}`);
                  if (item.subject) chunks.push(`BOOK SUBJECTS: ${(item.subject || []).slice(0, 100).join(', ')}`);
                  if (item.description) chunks.push(`BOOK DESCRIPTION: ${typeof item.description === 'string' ? item.description : JSON.stringify(item.description)}`);
                  if (item.title || item.author_name) chunks.push(`CATALOGUE IDENTITY: ${item.title || book.title}; AUTHOR: ${(item.author_name || [book.author]).join(', ')}; YEAR: ${item.first_publish_year || ''}; PUBLISHER: ${(item.publisher || []).join(', ')}`);
                }
                for (const item of data.response?.docs || []) {
                  if (item.description) chunks.push(`INTERNET ARCHIVE DESCRIPTION: ${typeof item.description === 'string' ? item.description : JSON.stringify(item.description)}`);
                  if (item.subject) chunks.push(`INTERNET ARCHIVE SUBJECTS: ${(item.subject || []).slice(0, 100).join(', ')}`);
                }
              }
            }));
            return chunks.join('\\n').slice(0, 100000);
          }

          function promptFor'''
          s, n = research_re.subn(research_new, s, count=1)
          if n != 1:
            raise SystemExit('researchBooks replacement failed')

          prompt_re = re.compile(r"function promptFor[\\s\\S]*?\\n}\\n\\nasync function generateBatch", re.M)
          prompt_new = '''function promptFor(book: QuizBook, count: number, difficulty: string, instructions: string, previous: string[], research: string) {
            const custom = instructions.trim();
            const userMode = custom
              ? `MANDATORY USER QUIZ INSTRUCTIONS (HIGHEST PRIORITY AFTER SAFETY AND FACTUALITY):\\n${custom}\\nYou MUST visibly follow these instructions in the questions. Treat requested topics, characters, chapters, themes, events, comparisons, question styles, and focus areas as hard requirements. If an instruction conflicts with exact-book evidence, never invent a fact; satisfy it only with supported material.`
              : `NO USER INSTRUCTIONS WERE PROVIDED. Deliberately vary the quiz across the book's available evidence: characters, relationships, plot/events, causes and consequences, settings, chronology, themes, conflicts, language/style, symbols, decisions, and distinctive details. Do not over-concentrate on one aspect.`;
            return `You are EDUWILLS Book Intelligence AI.\\n\\nBOOK: ${book.title}\\nAUTHOR: ${book.author}\\nTASK: Generate EXACTLY ${count} factual multiple-choice questions about this exact book.\\n\\n${userMode}\\n\\nDIFFICULTY: ${difficulty}.\\n\\nIDENTITY LOCK: Never substitute another work, adaptation, similarly named book, person, city, or general knowledge.\\nEVIDENCE LOCK: Every question, option, answer, and explanation must be supported by the supplied exact-book evidence. Never infer missing facts from names or stereotypes.\\nQUESTION MIX: Unless mandatory user instructions say otherwise, avoid repetitive metadata questions and prioritize book-specific content.\\nFORMAT: Return ONLY JSON {"questions":[{"question":"...","options":["...","...","...","..."],"answer":0,"explanation":"...","evidence":"..."}]}. Exactly four plausible options; answer is zero-based; no markdown.\\nPREVIOUS QUESTIONS TO AVOID: ${previous.slice(-60).join(' | ')}\\n\\nEXACT-BOOK EVIDENCE:\\n${research.slice(0, 80000)}`;
          }

          async function generateBatch'''
          s, n = prompt_re.subn(prompt_new, s, count=1)
          if n != 1:
            raise SystemExit('promptFor replacement failed')

          s = s.replace("  const evidenceByBook = await Promise.all(books.map(async (book) => researchBooks([book])));", "  const evidenceByBook = _research.trim() ? books.map(() => _research) : await Promise.all(books.map((book) => researchBooks([book])));")
          stable.write_text(s)

          grounding = Path('lib/verifiedBookGrounding.ts')
          g = grounding.read_text()
          if "'lekki headmaster|kabir alabi garba'" not in g:
            marker = "  'scars|irabor': ["
            insert = '''  'lekki headmaster|kabir alabi garba': [
    'VERIFIED BOOK: The Lekki Headmaster, by Kabir Alabi Garba; first published in Nigeria by Winepress Publishing in 2023.',
    'BOOK FACT: The novel is the JAMB general text for the 2026 UTME and is expected to be read by candidates.',
    'BOOK FACT: The story centres on Mr. Adebepo Adewale, commonly called Bepo, the principal/headmaster of Stardom Schools in Lekki, Lagos.',
    'BOOK FACT: The narrative examines education, migration/japa pressure, patriotism, professional commitment, leadership, integrity, and challenges within Nigerian society and schooling.',
    'BOOK FACT: Major settings include Stardom Schools in Lekki, Lagos, and Badagry, with the story also involving travel/migration decisions.',
    'GROUNDING RULE: Do not import characters, events, or plot details from unrelated books. Prefer verified book-specific evidence over generic summaries.',
    'GROUNDING RULE: Because secondary study guides can disagree on minor details, do not invent a detail when the available evidence does not establish it.'
  ].join('\\n'),
'''
            g = g.replace(marker, insert + marker, 1)
            anchor_marker = "  'scars|irabor': ["
            anchor_insert = "  'lekki headmaster|kabir alabi garba': ['lekki headmaster', 'kabir alabi garba', 'bepo', 'adewale', 'stardom schools', 'headmaster', 'principal', 'lekki', 'lagos', 'badagry', 'japa', 'migration', 'education', 'teacher', 'school', 'patriotism', 'leadership', 'integrity', 'teachers'],\n"
            g = g.replace(anchor_marker, anchor_insert + anchor_marker, 1)
            grounding.write_text(g)

          page = Path('app/dashboard/quiz/page.tsx')
          p = page.read_text()
          if "searchBookAuthors," not in p:
            p = p.replace("  researchBooks,\n", "  researchBooks,\n  searchBookAuthors,\n")
          find_re = re.compile(r"  async function findBook\(\) \{[\\s\\S]*?\n  \}\n\n  async function searchAuthor", re.M)
          find_new = '''  async function findBook() {
    const raw = title.trim();
    if (!raw) return;
    setSearching(true);
    setMessage('');
    setAuthors([]);
    setAuthor('');
    setAuthorQuery('');
    try {
      const results = await searchBookAuthors('title', raw);
      const curated = CURATED_BOOKS.filter((b) => [b.title, ...b.aliases].some((a) => normalize(a).includes(normalize(raw)) || normalize(raw).includes(normalize(a))));
      const names = Array.from(new Set([...curated.flatMap(b => b.authors), ...results.flatMap(r => r.authors)]));
      setAuthors(names.slice(0, 80));
      setMessage(names.length ? 'Select the verified author that matches your book.' : 'No author was found. Try the full title or search by author name.');
    } catch {
      setMessage('Book search is temporarily unavailable.');
    } finally {
      setSearching(false);
    }
  }

  async function searchAuthor'''
          p, n = find_re.subn(find_new, p, count=1)
          if n != 1:
            raise SystemExit('findBook replacement failed')

          author_re = re.compile(r"  async function searchAuthor\(\) \{[\\s\\S]*?\n  \}\n\n  async function saveBook", re.M)
          author_new = '''  async function searchAuthor() {
    const q = authorQuery.trim();
    if (!q) return;
    setSearching(true);
    setMessage('');
    try {
      const results = await searchBookAuthors('author', q);
      const names = Array.from(new Set(results.flatMap(r => r.authors)));
      setAuthors(names.slice(0, 80));
      setMessage(names.length ? 'Select a verified author from the results.' : 'No verified author match was found. Try another spelling.');
    } finally {
      setSearching(false);
    }
  }

  async function saveBook'''
          p, n = author_re.subn(author_new, p, count=1)
          if n != 1:
            raise SystemExit('searchAuthor replacement failed')

          # Avoid doing the same research twice. generateQuiz now accepts the research already fetched here.
          p = p.replace("      const generated = await generateQuiz(\n", "      const generated = await generateQuiz(\n")
          page.write_text(p)
          PY
      - name: Commit fixes
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/quizAiClientStable.ts lib/verifiedBookGrounding.ts app/dashboard/quiz/page.tsx
          git commit -m 'fix: improve book intelligence and quiz instruction handling [skip ci]'
          git push
