name: Apply Community UI v6 Repair

on:
  push:
    branches: [main]
    paths:
      - 'scripts/repair-community-ui-v6.mjs'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Apply community UI v6 repair
        run: node scripts/repair-community-ui-v6.mjs

      - name: Verify community UI v6 source
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          group=Path('app/dashboard/community/group/page.tsx').read_text()
          chat=Path('app/dashboard/community/chat/page.tsx').read_text()
          assert 'aria-label="Write a message"' in group
          assert 'const loadMembers=async' in group
          assert 'GROUP MEMBERS' in group
          assert 'async function joinGroup()' in group
          assert '||!isMember' in group
          assert 'const recentRows=useMemo(()=>[...chatRows]' in chat
          print('Community UI v6 source verification passed.')
          PY

      - name: Commit repaired source
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --quiet; then
            echo 'No source changes were necessary.'
          else
            git add app/dashboard/community/group/page.tsx app/dashboard/community/chat/page.tsx storage.rules
            git commit -m 'Apply community UI v6 repair'
            git push origin HEAD:main
          fi
