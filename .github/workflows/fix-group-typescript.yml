name: Fix group TypeScript

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-group-typescript.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Repair group source deterministically
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('app/dashboard/community/group/page.tsx')
          s=p.read_text()
          pattern=r" useEffect\(\(\)=>\{if\(!id\|\|!user\)return;return onSnapshot\(doc\(db,'communityGroups',id\),.*?\n useEffect\(\(\)=>\{if\(!g\|\|!user\|\|!understood\)return;"
          replacement=""" useEffect(()=>{\n  if(!id||!user)return;\n  return onSnapshot(doc(db,'communityGroups',id),s=>{\n   if(!s.exists()){setNotice('This group no longer exists.');setG(null);return}\n   const d:any={id:s.id,...s.data()};\n   if(d.deleted){setNotice('This group has been deleted.');setG(null);return}\n   setG(d);\n   setIsMember(d.ownerId===user.uid||d.adminIds?.includes(user.uid)||d.memberIds?.includes(user.uid));\n   setName(d.name||'');setDesc(d.description||'');setAvatar(d.avatarUrl||'');setCover(d.coverImageUrl||'');\n   setUnderstood(d.creatorRulesAccepted===true||d.ownerId!==user.uid);\n  });\n },[id,user?.uid]);\n useEffect(()=>{if(!g||!user||!understood||!isMember)return;"""
          s,n=re.subn(pattern,replacement,s,count=1,flags=re.S)
          if n!=1: raise SystemExit(f'group listener pattern mismatch: {n}')
          state="[joining,setJoining]=useState(false),[isMember,setIsMember]=useState(false),"
          if '[isMember,setIsMember]' not in s:
              marker="[unread,setUnread]=useState(0);"
              if marker not in s: raise SystemExit('group state marker not found')
              s=s.replace(marker,state+marker,1)
          if "You must join this group before you can view or send messages." not in s:
              needle=" if(!g)return"
              gate=""" if(g&&!isMember)return <main className=\"min-h-screen bg-paper p-6\"><a href={BASE+'/dashboard/community/'} className=\"inline-flex items-center gap-2 rounded-xl border bg-white px-4 py-3 text-sm font-black\"><ArrowLeft size={17}/> Community</a><div className=\"mx-auto mt-12 max-w-xl rounded-3xl bg-white p-8 text-center\"><Users className=\"mx-auto text-slate-300\" size={40}/><h1 className=\"mt-4 text-2xl font-black\">Join this group</h1><p className=\"mt-2 text-sm text-slate-500\">You must join this group before you can view or send messages.</p><button disabled={joining} onClick={async()=>{setJoining(true);try{await updateDoc(doc(db,'communityGroups',id),{memberIds:arrayUnion(user.uid),updatedAt:serverTimestamp()});setIsMember(true);setNotice('You joined the group.')}catch(e:any){setNotice(e?.message||'Could not join this group.')}finally{setJoining(false)}}} className=\"mt-5 w-full rounded-xl bg-ink px-5 py-4 text-sm font-black text-white disabled:opacity-50\">{joining?'Joining…':'JOIN GROUP'}</button></div></main>;\n if(!g)return"""
              if needle not in s: raise SystemExit('group render gate not found')
              s=s.replace(needle,gate,1)
          p.write_text(s)
          PY
      - name: Typecheck and build
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npx tsc --noEmit --pretty false
          npm run build
      - name: Persist repaired source with race-safe retry
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/dashboard/community/group/page.tsx
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Fix community group membership and listener'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            git reset --soft origin/main
            git commit -m 'Fix community group membership and listener'
            sleep 2
          done
          exit 1
