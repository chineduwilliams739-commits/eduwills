name: Apply Payment Activation Final Repair

on:
  push:
    branches: [main]
    paths:
      - 'scripts/repair-payment-activation-final.mjs'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply repair
        run: node scripts/repair-payment-activation-final.mjs
      - name: Verify repair
        run: |
          grep -q 'PAYMENT_ACTIVATION_FINAL_REPAIR_V1' workers/payments/src/index.js
          grep -q 'paymentTransactions/' workers/payments/src/index.js
          grep -q 'parseMetadata' workers/payments/src/index.js
      - name: Commit repaired Worker
        run: |
          if git diff --quiet; then
            echo 'No changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add workers/payments/src/index.js
          git commit -m 'Fix Paystack activation token persistence'
          git push origin HEAD:main
