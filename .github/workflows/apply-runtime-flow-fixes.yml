name: Apply Runtime Flow Fixes

on:
  push:
    branches: [main]
    paths:
      - 'app/dashboard/activation/page.tsx'
      - 'app/signup/page.tsx'
      - 'app/dashboard/page.tsx'
      - 'lib/aiAccess.ts'
      - '.github/workflows/apply-runtime-flow-fixes.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[runtime-fix]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply requested activation signup and dashboard fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          activation=Path('app/dashboard/activation/page.tsx')
          a=activation.read_text()
          a=a.replace(');,[quote,setQuote=',');[quote,setQuote=')
          a=a.replace("const COUNTRIES=[['NG','Nigeria','NGN'],['US','United States','USD'],['GB','United Kingdom','GBP'],['GH','Ghana','GHS'],['KE','Kenya','KES'],['ZA','South Africa','ZAR'],['CI','Côte d’Ivoire','XOF'],['INT','Other country','USD']] as const;", "const COUNTRIES=[['NG','Nigeria','NGN'],['INT','Other countries','USD']] as const;")
          a=a.replace("const CURRENCIES=[['NGN','NGN — Nigerian Naira'],['USD','USD — US Dollar'],['GBP','GBP — British Pound'],['EUR','EUR — Euro'],['GHS','GHS — Ghanaian Cedi'],['KES','KES — Kenyan Shilling'],['ZAR','ZAR — South African Rand'],['XOF','XOF — West African CFA Franc']] as const;", "const CURRENCIES=[['NGN','NGN — Nigerian Naira'],['USD','USD — US Dollar']] as const;")
          a=a.replace("const RATES:Record<string,number>={USD:1,GBP:.75,EUR:.86,GHS:11.2,KES:129,ZAR:17.8,XOF:560,NGN:1550};", "const RATES:Record<string,number>={USD:1,NGN:1550};")
          activation.write_text(a)
          signup=Path('app/signup/page.tsx')
          u=signup.read_text()
          u=u.replace("const options=[{id:'senior',name:'Senior Secondary',price:3000,status:'Coming soon'},{id:'junior',name:'Junior Secondary',price:3000,status:'Coming soon'},{id:'primary',name:'Primary',price:2000,status:'Coming soon'},{id:'book',name:'Book Learner',price:4000,status:'Available now'}];", "const options=[{id:'senior',name:'Senior Secondary',price:3000,status:'Available now'},{id:'junior',name:'Junior Secondary',price:3000,status:'Available now'},{id:'primary',name:'Primary',price:2000,status:'Available now'},{id:'book',name:'Book Learner',price:4000,status:'Available now'}];")
          u=u.replace("const[selected,setSelected]=useState<string[]>(['book']);", "const[selected,setSelected]=useState<string[]>([]);")
          signup.write_text(u)
          dashboard=Path('app/dashboard/page.tsx')
          d=dashboard.read_text()
          d=d.replace('className="mt-7 grid gap-4 sm:grid-cols-2 lg:grid-cols-5"','className="mt-7 grid items-start gap-4 sm:grid-cols-2 lg:grid-cols-5"')
          dashboard.write_text(d)
          PY
          python3 - <<'PY'
          from pathlib import Path
          import re
          activation=Path('app/dashboard/activation/page.tsx').read_text()
          signup=Path('app/signup/page.tsx').read_text()
          dashboard=Path('app/dashboard/page.tsx').read_text()
          ai=Path('lib/aiAccess.ts').read_text()
          assert re.search(r"const\s+COUNTRIES\s*=\s*\[.*'NG'.*'Nigeria'.*'NGN'.*'INT'.*'Other countries'.*'USD'.*\]\s*as const", activation, re.S)
          assert re.search(r"const\s+CURRENCIES\s*=\s*\[.*'NGN'.*'NGN — Nigerian Naira'.*'USD'.*'USD — US Dollar'.*\]\s*as const", activation, re.S)
          assert re.search(r"\[quote,setQuote\]\s*=\s*useState", activation)
          assert 'Coming soon' not in signup
          assert 'items-start gap-4 sm:grid-cols-2 lg:grid-cols-5' in dashboard
          assert 'no-active-willitoken' in ai
          print('Runtime activation, signup, dashboard and AI access checks passed.')
          PY
      - name: Commit fixes with rebase protection
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/dashboard/activation/page.tsx app/signup/page.tsx app/dashboard/page.tsx
          if git diff --cached --quiet; then echo 'No requested UI changes needed.'; exit 0; fi
          git commit -m "Apply activation signup and dashboard UI fixes [runtime-fix]"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
