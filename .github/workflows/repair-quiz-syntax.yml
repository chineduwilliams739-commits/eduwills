name: Repair quiz overview syntax

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Repair invalid await in explainFailure
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('app/dashboard/quiz/page.tsx')
          s = p.read_text()
          bad = "if (r.ok) setWhy((p) => ({ ...p, [i]: await r.text() }));"
          good = "if (r.ok) { const text = await r.text(); setWhy((p) => ({ ...p, [i]: text })); }"
          if bad in s:
              p.write_text(s.replace(bad, good, 1))
              print('Repaired invalid await expression.')
          else:
              print('No invalid await expression found; nothing to repair.')
          PY

      - name: Repair malformed Quiz Studio JSX escapes
        shell: bash
        run: |
          set -euxo pipefail
          node scripts/repair-quiz-tsx-source.mjs

      - name: Apply exact-book grounding, resumable generation and dropdown repair
        shell: bash
        run: |
          set -euxo pipefail
          node --check scripts/repair-quiz-grounding-v7.mjs
          node scripts/repair-quiz-grounding-v7.mjs

      - name: Validate quiz source and production build
        shell: bash
        run: |
          set -euxo pipefail
          grep -q 'v21-exact-book-evidence-resumable' lib/quizAiClient.ts
          grep -q 'EXACT-BOOK EVIDENCE' lib/quizAiClient.ts
          grep -q 'Never call Sànyà a boy or man' lib/quizAiClient.ts
          grep -q 'attempts<20' lib/quizAiClient.ts
          grep -q 'Resume data has been cached' lib/quizAiClient.ts
          grep -q 'bg-gradient-to-r from-white via-slate-50 to-cyan-50' app/dashboard/quiz/page.tsx
          grep -q 'safeQuestionCount' app/dashboard/quiz/page.tsx
          npm run build

      - name: Commit repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- app/dashboard/quiz/page.tsx lib/quizAiClient.ts scripts/repair-quiz-grounding-v7.mjs; then
            echo "No repair changes needed."
            exit 0
          fi
          git add app/dashboard/quiz/page.tsx lib/quizAiClient.ts scripts/repair-quiz-grounding-v7.mjs
          git commit -m "fix quiz grounding generation and dropdowns"
          git push
