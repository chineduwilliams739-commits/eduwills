name: Repair quiz overview syntax

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Repair invalid await in explainFailure
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('app/dashboard/quiz/page.tsx')
          s = p.read_text()
          bad = "if (r.ok) setWhy((p) => ({ ...p, [i]: await r.text() }));"
          good = "if (r.ok) { const text = await r.text(); setWhy((p) => ({ ...p, [i]: text })); }"
          if bad in s:
              p.write_text(s.replace(bad, good, 1))
              print('Repaired invalid await expression.')
          else:
              print('No invalid await expression found; nothing to repair.')
          PY

      - name: Commit repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- app/dashboard/quiz/page.tsx; then
            echo "No repair needed."
            exit 0
          fi
          git add app/dashboard/quiz/page.tsx
          git commit -m "fix quiz overview async syntax"
          git push
