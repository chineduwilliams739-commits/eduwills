name: Harden EduWills International Payments

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/harden-international-payments.yml'

permissions:
  contents: write
  actions: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch international payment endpoints and checkout
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          worker=Path('workers/payments/src/index.js')
          s=worker.read_text()
          a=s.index("if(url.pathname==='/paystack/quote')")
          b=s.index("if(url.pathname==='/paystack/initialize')",a)
          q="""if(url.pathname==='/paystack/quote'){try{const idToken=(req.headers.get('x-firebase-id-token')||req.headers.get('authorization')||'').replace(/^Bearer /,'');const u=await authLookup(env,idToken);if(!u?.emailVerified)return json({error:'Verify your email before paying for activation.'},403,origin);const body=await req.json(),cats=cleanCategories(body.categories);if(!cats.length)return json({error:'Select at least one category.'},400,origin);const country=String(body.country||'INT').toUpperCase(),requestedCurrency=String(body.currency||COUNTRY_CURRENCY[country]||'USD').toUpperCase(),ngnTotal=baseTotal(cats);if(country==='NG'&&requestedCurrency==='NGN')return json({localCurrency:'NGN',localAmount:ngnTotal,paymentCurrency:'NGN',paymentAmount:ngnTotal,international:false},200,origin);const paymentCurrency='USD',ngnToUsd=await fxRate('NGN','USD'),paymentAmount=Math.max(2,Math.round((ngnTotal*ngnToUsd+1)*100)/100);const localCurrency=FALLBACK_USD_RATES[requestedCurrency]?requestedCurrency:'USD',localRate=await fxRate('USD',localCurrency),localAmount=Math.round(paymentAmount*localRate*100)/100;return json({localCurrency,localAmount,paymentCurrency,paymentAmount,international:true},200,origin);}catch(e){return json({error:e?.message||'Could not calculate the payment total.'},500,origin);}}\n"""
          s=s[:a]+q+s[b:]
          a=s.index("if(url.pathname==='/paystack/initialize')")
          b=s.index("if(url.pathname==='/redeem')",a)
          i="""if(url.pathname==='/paystack/initialize'){try{const idToken=(req.headers.get('x-firebase-id-token')||req.headers.get('authorization')||'').replace(/^Bearer /,'');const u=await authLookup(env,idToken);if(!u?.emailVerified)return json({error:'Verify your email before paying for activation.'},403,origin);const body=await req.json(),cats=cleanCategories(body.categories);if(!cats.length)return json({error:'Select at least one category.'},400,origin);const country=String(body.country||'INT').toUpperCase(),requestedCurrency=String(body.currency||COUNTRY_CURRENCY[country]||'USD').toUpperCase(),ngnTotal=baseTotal(cats);let paymentCurrency='NGN',paymentAmount=ngnTotal,localCurrency='NGN',localAmount=ngnTotal;if(country!=='NG'||requestedCurrency!=='NGN'){paymentCurrency='USD';const ngnToUsd=await fxRate('NGN','USD');paymentAmount=Math.max(2,Math.round((ngnTotal*ngnToUsd+1)*100)/100);localCurrency=FALLBACK_USD_RATES[requestedCurrency]?requestedCurrency:'USD';const localRate=await fxRate('USD',localCurrency);localAmount=Math.round(paymentAmount*localRate*100)/100;}const ref=`EW-${u.localId.slice(0,8)}-${Date.now()}-${crypto.randomUUID().slice(0,8)}`;const data=await paystackPost(env,'transaction/initialize',{email:u.email,amount:Math.round(paymentAmount*100),currency:paymentCurrency,reference:ref,callback_url:env.CALLBACK_URL,metadata:{uid:u.localId,categories:cats,durationMs:31536000000,product:'eduwills_activation',country,email:u.email,fullName:String(body.fullName||''),username:String(body.username||''),baseAmount:ngnTotal,paymentAmount,paymentCurrency,localCurrency,localAmount}});await fsWrite(env,`paymentTransactions/${data.reference}`,{reference:data.reference,uid:u.localId,email:u.email,fullName:String(body.fullName||''),username:String(body.username||''),categories:JSON.stringify(cats),country,currency:paymentCurrency,paymentAmount,status:'pending',createdAt:new Date().toISOString(),callbackUrl:env.CALLBACK_URL,baseAmount:ngnTotal,localCurrency,localAmount});return json({reference:data.reference,authorization_url:data.authorization_url,access_code:data.access_code,localCurrency,localAmount,paymentCurrency,paymentAmount,international:country!=='NG'},200,origin);}catch(e){return json({error:e?.message||'PAYMENT_INITIALIZATION_FAILED'},500,origin);}}\n"""
          s=s[:a]+i+s[b:]
          worker.write_text(s)

          page=Path('app/dashboard/activation/page.tsx')
          s=page.read_text()
          s=s.replace(');,[quote,setQuote]=', '),[quote,setQuote]=')
          old_state=",[paymentSuccess,setPaymentSuccess]=useState<{code?:string;emailSent:boolean;emailError?:string}|null>(null);"
          if old_state in s and '[quote,setQuote]' not in s:
              s=s.replace(old_state,old_state+",[quote,setQuote]=useState<{localCurrency:string;localAmount:number;paymentCurrency:string;paymentAmount:number;international:boolean}|null>(null);",1)
          old_display=" const display=useMemo(()=>{const ngn=selected.reduce((s,c)=>s+(PRICES[c]||0),0);if(country==='NG'&&currency==='NGN')return{localCurrency:'NGN',localAmount:ngn,paymentCurrency:'NGN',paymentAmount:ngn,international:false};const usd=ngn/1550+1;return{localCurrency:currency,localAmount:Math.round(usd*(RATES[currency]||1)*100)/100,paymentCurrency:'USD',paymentAmount:Math.round(usd*100)/100,international:true}},[selected,currency,country]);"
          new_display=" const display=quote||{localCurrency:'NGN',localAmount:selected.reduce((s,c)=>s+(PRICES[c]||0),0),paymentCurrency:'NGN',paymentAmount:selected.reduce((s,c)=>s+(PRICES[c]||0),0),international:false};\n useEffect(()=>{let cancelled=false;(async()=>{if(!selected.length){setQuote(null);return}try{const current=auth.currentUser;if(!current){setQuote(null);return}const jwt=await current.getIdToken(true),backend=await getBackend();const r=await fetch(`${backend}/paystack/quote`,{method:'POST',headers:{'Content-Type':'application/json',Authorization:`Bearer ${jwt}`,'X-Firebase-ID-Token':jwt},body:JSON.stringify({categories:selected,country,currency}),cache:'no-store'});const t=await r.text();let d:any={};try{d=JSON.parse(t)}catch{}if(!r.ok)throw new Error(d.error||'Could not calculate the payment total.');if(!cancelled)setQuote(d)}catch{if(!cancelled)setQuote(null)}})();return()=>{cancelled=true}},[selected,country,currency]);"
          if old_display in s:s=s.replace(old_display,new_display,1)
          old_body="body:JSON.stringify({categories:selected,country,currency,amount:display.paymentAmount,paymentCurrency:display.paymentCurrency,durationMs:31536000000,fullName:user?.fullName||'',username:user?.username||''})"
          new_body="body:JSON.stringify({categories:selected,country,currency,fullName:user?.fullName||'',username:user?.username||''})"
          if old_body in s:s=s.replace(old_body,new_body,1)
          s=s.replace("disabled={paying||!selected.length}","disabled={paying||!selected.length||!quote}",1)
          old_total="{selected.length?money(display.localAmount,display.localCurrency):'—'}"
          new_total="{selected.length?(quote?money(display.localAmount,display.localCurrency):'Calculating…'):'—'}"
          if old_total in s:s=s.replace(old_total,new_total,1)
          page.write_text(s)
          PY

          npx tsc --noEmit --pretty false
          node --check workers/payments/src/index.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add workers/payments/src/index.js app/dashboard/activation/page.tsx
          if ! git diff --cached --quiet; then
            git commit -m 'Fix international checkout state syntax'
            git push origin HEAD:main
          else
            echo 'International payment changes already present.'
          fi
