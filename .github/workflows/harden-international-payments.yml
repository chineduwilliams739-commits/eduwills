name: Harden EduWills International Payments

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/harden-international-payments.yml'

permissions:
  contents: write
  actions: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch payment endpoints
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('workers/payments/src/index.js'); s=p.read_text()
          a=s.index("if(url.pathname==='/paystack/quote')"); b=s.index("if(url.pathname==='/paystack/initialize')",a)
          q="""if(url.pathname==='/paystack/quote'){try{const idToken=(req.headers.get('x-firebase-id-token')||req.headers.get('authorization')||'').replace(/^Bearer /,'');const u=await authLookup(env,idToken);if(!u?.emailVerified)return json({error:'Verify your email before paying for activation.'},403,origin);const body=await req.json(),cats=cleanCategories(body.categories);if(!cats.length)return json({error:'Select at least one category.'},400,origin);const country=String(body.country||'INT').toUpperCase(),requestedCurrency=String(body.currency||COUNTRY_CURRENCY[country]||'USD').toUpperCase(),ngnTotal=baseTotal(cats);let localCurrency='NGN',localAmount=ngnTotal;if(country!=='NG'||requestedCurrency!=='NGN'){localCurrency=FALLBACK_USD_RATES[requestedCurrency]?requestedCurrency:'USD';const localRate=await fxRate('NGN',localCurrency);localAmount=Math.round(ngnTotal*localRate*100)/100;}return json({localCurrency,localAmount,paymentCurrency:'NGN',paymentAmount:ngnTotal,international:country!=='NG'},200,origin);}catch(e){return json({error:e?.message||'Could not calculate the payment total.'},500,origin);}}\n"""
          s=s[:a]+q+s[b:]
          a=s.index("if(url.pathname==='/paystack/initialize')"); b=s.index("if(url.pathname==='/redeem')",a)
          i="""if(url.pathname==='/paystack/initialize'){try{const idToken=(req.headers.get('x-firebase-id-token')||req.headers.get('authorization')||'').replace(/^Bearer /,'');const u=await authLookup(env,idToken);if(!u?.emailVerified)return json({error:'Verify your email before paying for activation.'},403,origin);const body=await req.json(),cats=cleanCategories(body.categories);if(!cats.length)return json({error:'Select at least one category.'},400,origin);const country=String(body.country||'INT').toUpperCase(),requestedCurrency=String(body.currency||COUNTRY_CURRENCY[country]||'USD').toUpperCase(),ngnTotal=baseTotal(cats);const paymentCurrency='NGN',paymentAmount=ngnTotal;let localCurrency='NGN',localAmount=ngnTotal;if(country!=='NG'||requestedCurrency!=='NGN'){localCurrency=FALLBACK_USD_RATES[requestedCurrency]?requestedCurrency:'USD';const localRate=await fxRate('NGN',localCurrency);localAmount=Math.round(ngnTotal*localRate*100)/100;}const ref=`EW-${u.localId.slice(0,8)}-${Date.now()}-${crypto.randomUUID().slice(0,8)}`;const data=await paystackPost(env,'transaction/initialize',{email:u.email,amount:Math.round(paymentAmount*100),currency:paymentCurrency,reference:ref,callback_url:env.CALLBACK_URL,metadata:{uid:u.localId,categories:cats,durationMs:31536000000,product:'eduwills_activation',country,email:u.email,fullName:String(body.fullName||''),username:String(body.username||''),baseAmount:ngnTotal,paymentAmount,paymentCurrency,localCurrency,localAmount}});await fsWrite(env,`paymentTransactions/${data.reference}`,{reference:data.reference,uid:u.localId,email:u.email,fullName:String(body.fullName||''),username:String(body.username||''),categories:JSON.stringify(cats),country,currency:paymentCurrency,paymentAmount,status:'pending',createdAt:new Date().toISOString(),callbackUrl:env.CALLBACK_URL,baseAmount:ngnTotal,localCurrency,localAmount});return json({reference:data.reference,authorization_url:data.authorization_url,access_code:data.access_code,localCurrency,localAmount,paymentCurrency,paymentAmount,international:country!=='NG'},200,origin);}catch(e){return json({error:e?.message||'PAYMENT_INITIALIZATION_FAILED'},500,origin);}}\n"""
          s=s[:a]+i+s[b:]
          p.write_text(s)
          PY
          node --check workers/payments/src/index.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add workers/payments/src/index.js
          if ! git diff --cached --quiet; then git commit -m 'Fix Paystack international currency error' && git push origin HEAD:main; fi
