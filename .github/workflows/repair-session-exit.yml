name: Repair quiz exit and session integrity

on:
  push:
    branches: [main]
    paths:
      - 'app/dashboard/quiz/page.tsx'
      - 'app/dashboard/quiz/take/page.tsx'
      - 'app/dashboard/page.tsx'
      - 'app/dashboard/layout.tsx'
      - '.github/workflows/repair-session-exit.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, '[session-repair]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply robust session and exit fixes
        shell: python
        run: |
          from pathlib import Path

          take = Path('app/dashboard/quiz/take/page.tsx')
          layout = Path('app/dashboard/layout.tsx')
          t = take.read_text(encoding='utf-8')
          l = layout.read_text(encoding='utf-8')

          # The dedicated take route's Exit button is an intentional in-app
          # action. It must ask for confirmation and return to Quiz Studio,
          # without consuming the page-leave warning counter.
          if 'function endQuiz()' not in t:
              marker = '  async function attemptLeave(destination?: string) {'
              addition = '''  function endQuiz() {
            if (done || allowNavigationRef.current) return;
            const ok = window.confirm('Do you want to end this quiz? Your current progress will be discarded and you will return to Quiz Studio.');
            if (!ok) return;
            allowNavigationRef.current = true;
            try { sessionStorage.removeItem('eduwills_pending_quiz'); } catch {}
            window.location.assign(`${BASE}/dashboard/quiz/`);
          }

'''
              if marker in t:
                  t = t.replace(marker, addition + marker, 1)

          t = t.replace(
              'onClick={() => void attemptLeave(`${BASE}/dashboard/quiz/`)}',
              'onClick={endQuiz}',
              1,
          )

          # Dashboard layout is the common parent of the dashboard, quiz,
          # history and AI pages. Revalidate the Firebase identity when the
          # user returns after being away for at least one minute.
          if 'eduwillsIdentityVisibilityGuard' not in l:
              marker = '\n  if (!ready) {'
              guard = '''
  useEffect(() => {
    let hiddenAt = 0;
    const eduwillsIdentityVisibilityGuard = async () => {
      if (document.visibilityState === 'hidden') {
        hiddenAt = Date.now();
        return;
      }
      if (!hiddenAt || Date.now() - hiddenAt < 60000) return;
      hiddenAt = 0;
      const user = auth.currentUser;
      if (!user) {
        window.location.replace(`${BASE}/login/`);
        return;
      }
      try {
        const snap = await getDoc(doc(db, 'users', user.uid));
        const data = snap.data() || {};
        const identity = String(data.fullName || data.username || user.displayName || '').trim();
        if (!snap.exists() || !identity) {
          await signOut(auth);
          window.location.replace(`${BASE}/login/`);
        }
      } catch (error) {
        console.error('EDUWILLS resume identity validation failed:', error);
        await signOut(auth).catch(() => undefined);
        window.location.replace(`${BASE}/login/`);
      }
    };
    document.addEventListener('visibilitychange', eduwillsIdentityVisibilityGuard);
    return () => document.removeEventListener('visibilitychange', eduwillsIdentityVisibilityGuard);
  }, []);
'''
              if marker in l:
                  l = l.replace(marker, guard + marker, 1)

          take.write_text(t, encoding='utf-8')
          layout.write_text(l, encoding='utf-8')

          assert 'function endQuiz()' in t
          assert 'onClick={endQuiz}' in t
          assert 'eduwillsIdentityVisibilityGuard' in l
          print('Session/exit repair source checks passed.')

      - name: Verify repaired source
        shell: bash
        run: |
          grep -Fq 'function endQuiz()' app/dashboard/quiz/take/page.tsx
          grep -Fq 'onClick={endQuiz}' app/dashboard/quiz/take/page.tsx
          grep -Fq 'eduwillsIdentityVisibilityGuard' app/dashboard/layout.tsx
          grep -Fq 'Do you want to end this quiz?' app/dashboard/quiz/take/page.tsx
          grep -Fq 'leaveAttempts' app/dashboard/quiz/take/page.tsx

      - name: Commit and push repair
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No repair changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/dashboard/quiz/take/page.tsx app/dashboard/layout.tsx
          git commit -m 'fix: separate quiz exit and stale session handling [session-repair]'
          git push
