name: Apply EDUWILLS message system

on:
  push:
    branches: [main]
    paths:
      - 'scripts/upgrade-message-system.mjs'
      - '.github/workflows/apply-message-system.yml'
  workflow_dispatch:

jobs:
  upgrade:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply message system
        run: node scripts/upgrade-message-system.mjs
      - name: Commit generated source
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/dashboard/community/group/page.tsx firestore.rules
          if git diff --cached --quiet; then echo 'No generated changes.'; exit 0; fi
          git commit -m 'Add message actions timestamps and unread state'
          git pull --rebase origin main
          git push
