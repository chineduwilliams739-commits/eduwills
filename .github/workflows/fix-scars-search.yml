name: Fix SCARS search

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-scars:
    if: ${{ !contains(github.event.head_commit.message, 'fix: improve SCARS author search') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true

      - name: Repair SCARS catalogue and author matching
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('lib/quizAiClient.ts')
          s = p.read_text(encoding='utf-8')

          # Ensure the curated SCARS entry contains an explicit author identity.
          old = "'scars': ['SCARS: Nigeria’s Journey and the Boko Haram Conundrum examines Nigeria’s journey and the Boko Haram conundrum.','SCARS is associated with Gen. Lucky Irabor.'],"
          new = "'scars': ['SCARS: Nigeria’s Journey and the Boko Haram Conundrum examines Nigeria’s journey and the Boko Haram conundrum.','SCARS is associated with Gen. Lucky Irabor.','SCARS: Nigeria’s Journey and the Boko Haram Conundrum was written by Gen. Lucky Irabor.'],"
          if old in s:
              s = s.replace(old, new, 1)
          elif "'scars':" not in s:
              raise SystemExit('SCARS catalogue entry was not found; refusing an unsafe edit.')

          # Add a deterministic author-search override immediately after the results set.
          marker = "const results: BookSearchResult[] = []; const seen = new Set<string>();"
          if marker not in s:
              raise SystemExit('Search results marker was not found; refusing an unsafe edit.')

          override = '''const results: BookSearchResult[] = []; const seen = new Set<string>();
          if (kind === 'author' && /\\b(irabor|lucky\\s+irabor|gen(?:eral)?\\.?\\s+lucky\\s+irabor)\\b/i.test(query)) {
            addResult(results, seen, kind, key, 'SCARS: Nigeria’s Journey and the Boko Haram Conundrum', ['Gen. Lucky Irabor'], 'EDUWILLS verified catalogue');
          }'''
          if "EDUWILLS verified catalogue" not in s or "lucky\\s+irabor" not in s:
              s = s.replace(marker, override, 1)

          p.write_text(s, encoding='utf-8')
          PY

      - name: Verify SCARS search mapping
        run: |
          grep -q "SCARS: Nigeria’s Journey and the Boko Haram Conundrum was written by Gen. Lucky Irabor" lib/quizAiClient.ts
          grep -q "lucky\\s+irabor" lib/quizAiClient.ts

      - name: Commit and push repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/quizAiClient.ts
          if git diff --cached --quiet; then
            echo "SCARS search mapping is already present."
            exit 0
          fi
          git commit -m "fix: improve SCARS author search"
          git push origin HEAD:main
