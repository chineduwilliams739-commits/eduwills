name: Fix SCARS search

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-scars:
    if: ${{ !contains(github.event.head_commit.message, 'fix: improve SCARS author search') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add explicit SCARS author mapping
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('lib/quizAiClient.ts')
          s = p.read_text()
          old = "'scars': ['SCARS: Nigeria’s Journey and the Boko Haram Conundrum examines Nigeria’s journey and the Boko Haram conundrum.','SCARS is associated with Gen. Lucky Irabor.'],"
          new = "'scars': ['SCARS: Nigeria’s Journey and the Boko Haram Conundrum examines Nigeria’s journey and the Boko Haram conundrum.','SCARS is associated with Gen. Lucky Irabor.','SCARS: Nigeria’s Journey and the Boko Haram Conundrum was written by Gen. Lucky Irabor.'],"
          if old in s:
              s = s.replace(old, new, 1)
          marker = "  const results: BookSearchResult[] = []; const seen = new Set<string>();\n"
          insert = marker + "  if (kind === 'author' && /\\b(irabor|lucky\\s+irabor|gen(?:eral)?\\.?\\s+lucky\\s+irabor)\\b/i.test(query)) {\n    addResult(results, seen, kind, key, 'SCARS: Nigeria’s Journey and the Boko Haram Conundrum', ['Gen. Lucky Irabor'], 'EDUWILLS verified catalogue');\n  }\n"
          if marker not in s:
              raise SystemExit('Expected search results marker was not found; refusing to modify the file.')
          if insert not in s:
              s = s.replace(marker, insert, 1)
          if s == p.read_text():
              print('SCARS search mapping already present')
          else:
              p.write_text(s)
          PY
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/quizAiClient.ts
          git diff --cached --quiet && exit 0
          git commit -m "fix: improve SCARS author search"
          git push
