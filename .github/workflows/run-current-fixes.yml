name: Run Current Activation And Community Fixes

on:
  push:
    branches: [main]
    paths:
      - 'scripts/.eduwills-fix-trigger'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply deterministic fixes
        run: python3 scripts/apply-current-fixes.py
      - name: Validate activation source
        run: |
          set -euo pipefail
          grep -q "EMAIL_NOT_VERIFIED" workers/payments/src/index.js
          grep -q "alreadyActive" workers/payments/src/index.js
          grep -q "WilliToken delivery email" app/dashboard/activation/page.tsx
          grep -q "What you have access to" app/dashboard/activation/page.tsx
          grep -q "fixed inset-0 z-\[90\]" app/dashboard/activation/page.tsx
      - name: Install dependencies
        run: npm ci
      - name: Typecheck and build
        run: npm run build
      - name: Commit patched application
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add workers/payments/src/index.js app/dashboard/activation/page.tsx firestore.rules components/DeviceImageUpload.tsx
          if git diff --cached --quiet; then
            echo 'No new fixes to commit.'
          else
            git commit -m 'Fix activation verification token redemption and reactions'
            git push origin HEAD:main
          fi
