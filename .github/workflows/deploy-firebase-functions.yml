name: Deploy EduWills Firebase Functions

on:
  push:
    branches: [main]
    paths:
      - 'functions/**'
      - 'firebase.json'
      - '.github/workflows/deploy-firebase-functions.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Firebase CLI
        run: npm install -g firebase-tools@latest

      - name: Install Functions dependencies
        working-directory: functions
        run: npm install --no-audit --no-fund

      - name: Register cleanup scheduler
        working-directory: functions
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const file = 'index.js';
          let s = fs.readFileSync(file, 'utf8');
          const line = "Object.assign(exports, require('./cleanupWilliTokens'));";
          if (!s.includes(line)) {
            s = s.trimEnd() + "\n" + line + "\n";
            fs.writeFileSync(file, s);
          }
          NODE

      - name: Deploy Firebase Functions
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: firebase deploy --only functions --project eduwills --non-interactive
