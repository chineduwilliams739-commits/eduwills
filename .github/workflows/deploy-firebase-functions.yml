name: Deploy EduWills Firebase Functions

on:
  push:
    branches: [main]
    paths:
      - 'functions/**'
      - '.github/workflows/deploy-firebase-functions.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Authenticate Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_EDUWILLS }}
      - name: Install Firebase CLI
        uses: npm
        run: npm install -g firebase-tools
      - name: Install function dependencies
        working-directory: functions
        run: npm install --no-audit --no-fund
      - name: Configure private function parameters
        working-directory: functions
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          PAYSTACK_SECRET_KEY: ${{ secrets.PAYSTACK_SECRET_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
        run: |
          printf 'GROQ_API_KEY=%s\nOPENROUTER_API_KEY=%s\nPAYSTACK_SECRET_KEY=%s\nRESEND_API_KEY=%s\nRESEND_FROM_EMAIL=%s\n' "$GROQ_API_KEY" "$OPENROUTER_API_KEY" "$PAYSTACK_SECRET_KEY" "$RESEND_API_KEY" "$RESEND_FROM_EMAIL" > .env
      - name: Deploy functions
        run: firebase deploy --project eduwills --only functions --non-interactive
