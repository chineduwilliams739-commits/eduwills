name: Deploy EduWills Firebase Functions

on:
  push:
    branches: [main]
    paths:
      - 'functions/**'
      - 'scripts/repair-payment-category-and-revocation-v2.mjs'
      - 'firebase.json'
      - '.github/workflows/deploy-firebase-functions.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Firebase CLI
        run: npm install -g firebase-tools@latest

      - name: Install Functions dependencies
        working-directory: functions
        run: npm install --no-audit --no-fund

      - name: Apply payment/category/revocation lifecycle repair
        run: node scripts/repair-payment-category-and-revocation-v2.mjs

      - name: Register cleanup scheduler
        working-directory: functions
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const file = 'index.js';
          let s = fs.readFileSync(file, 'utf8');
          const line = "Object.assign(exports, require('./cleanupWilliTokens'));";
          if (!s.includes(line)) {
            s = s.trimEnd() + "\n" + line + "\n";
            fs.writeFileSync(file, s);
          }
          NODE

      - name: Authenticate Firebase with existing service account
        env:
          FIREBASE_SERVICE_ACCOUNT_EDUWILLS: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_EDUWILLS }}
        run: |
          test -n "$FIREBASE_SERVICE_ACCOUNT_EDUWILLS"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_EDUWILLS" > "$RUNNER_TEMP/firebase-service-account.json"
          node -e "const fs=require('fs'); const p=process.env.RUNNER_TEMP + '/firebase-service-account.json'; const x=JSON.parse(fs.readFileSync(p,'utf8')); if(!x.project_id || !x.client_email || !x.private_key) throw new Error('Firebase service account secret is missing required fields');"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-service-account.json" >> "$GITHUB_ENV"

      - name: Configure Firebase Paystack parameter
        env:
          PAYSTACK_SECRET_KEY: ${{ secrets.PAYSTACK_SECRET_KEY }}
        run: |
          test -n "$PAYSTACK_SECRET_KEY"
          printf 'PAYSTACK_SECRET_KEY=%s\n' "$PAYSTACK_SECRET_KEY" > functions/.env.eduwills
          chmod 600 functions/.env.eduwills

      - name: Verify payment lifecycle source
        working-directory: functions
        run: |
          set -euo pipefail
          grep -q 'mergedCategories' activationPayments.js
          grep -q 'activeWilliToken: code' activationPayments.js
          grep -q 'redeemedBy: uid' activationPayments.js
          grep -q 'active: true' activationPayments.js
          echo "Payment success now assigns purchased categories and active entitlement immediately."

      - name: Deploy Firebase Functions
        run: firebase deploy --only functions --project eduwills --non-interactive
