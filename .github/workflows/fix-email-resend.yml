name: Fix pending email verification resend

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-email-resend.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch email-change resend flow
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/dashboard/personal/page.tsx')
          s = p.read_text(encoding='utf-8')
          old = "async function resendVerification() { setEmailMessage(''); try { if (!auth.currentUser?.email) { setEmailMessage('Add an email first.'); return; } await sendEmailVerification(auth.currentUser); setEmailMessage('A new verification email has been sent.'); } catch (e: any) { setEmailMessage(e?.code === 'auth/too-many-requests' ? 'Please wait a little before requesting another verification email.' : 'Could not send the verification email.'); } }"
          new = "async function resendVerification() { setEmailMessage(''); const current = auth.currentUser; if (!current) { setEmailMessage('Your session has expired. Please sign in again.'); return; } try { if (pendingEmail) { await verifyBeforeUpdateEmail(current, pendingEmail); setEmailMessage(`A new verification email has been sent to ${pendingEmail}. Your current email remains active until you verify the new address.`); return; } if (!current.email) { setEmailMessage('Add an email first.'); return; } await sendEmailVerification(current); setEmailMessage('A new verification email has been sent.'); } catch (e: any) { console.error(e); const messages: Record<string,string> = {'auth/too-many-requests':'Please wait a little before requesting another verification email.','auth/requires-recent-login':'For security, sign out and sign in again, then request the email change again.','auth/email-already-in-use':'That email is already attached to another account. Please use a different email address.'}; setEmailMessage(messages[e?.code] || 'Could not send the verification email. Please try again.'); } }"
          if old not in s:
              raise SystemExit('Expected resendVerification function was not found; refusing to modify the file.')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Verify patch
        run: |
          grep -F "if (pendingEmail) { await verifyBeforeUpdateEmail(current, pendingEmail);" app/dashboard/personal/page.tsx

      - name: Commit fix and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/dashboard/personal/page.tsx
          git rm .github/workflows/fix-email-resend.yml
          git commit -m "Fix resending pending email-change verification"
          git push