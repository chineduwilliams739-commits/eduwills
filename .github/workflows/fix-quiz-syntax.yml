name: Fix quiz client syntax

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Repair malformed quiz client source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('lib/quizAiClientStable.ts')
          s = p.read_text()
          # Normalize escaped regex sequences that were written with an extra backslash.
          s = s.replace(r'[\\\\u0300-\\\\u036f]', r'[\\u0300-\\u036f]')
          s = s.replace(r'/\\\\s+/g', r'/\\s+/g')
          s = s.replace(r'/\\\\b(the|a|an|what|which|who|how|why|did|does|is|was|were|of|in|on|to|and|for|from|about|according)\\\\b/g', r'/\\b(the|a|an|what|which|who|how|why|did|does|is|was|were|of|in|on|to|and|for|from|about|according)\\b/g')
          s = s.replace(r'/\\\\b(author|written by|writer|publisher|publication|isbn|edition|published|year of publication)\\\\b/i', r'/\\b(author|written by|writer|publisher|publication|isbn|edition|published|year of publication)\\b/i')
          s = s.replace(r'/\\\\/$/g', r'/\\/$/g')
          p.write_text(s)
          PY
          npx tsc --noEmit --pretty false
      - name: Commit repair
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No source repair needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/quizAiClientStable.ts
          git commit -m "Fix malformed quiz client regex syntax"
          git push
