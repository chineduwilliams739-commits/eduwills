name: Deploy EDUWILLS AI Router

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'functions/**'
      - 'firebase.json'
      - '.github/workflows/deploy-ai-router.yml'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: functions/package.json

      - name: Install function dependencies
        working-directory: functions
        run: npm install --no-audit --no-fund

      - name: Verify required CI secrets
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_EDUWILLS }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$FIREBASE_SERVICE_ACCOUNT" || { echo "Missing FIREBASE_SERVICE_ACCOUNT_EDUWILLS"; exit 1; }
          test -n "$GROQ_API_KEY" || { echo "Missing GROQ_API_KEY"; exit 1; }
          test -n "$OPENROUTER_API_KEY" || { echo "Missing OPENROUTER_API_KEY"; exit 1; }
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-service-account.json"
          printf '%s' "$GROQ_API_KEY" > "$RUNNER_TEMP/groq-api-key.txt"
          printf '%s' "$OPENROUTER_API_KEY" > "$RUNNER_TEMP/openrouter-api-key.txt"
          node -e "JSON.parse(require('fs').readFileSync(process.env.RUNNER_TEMP + '/firebase-service-account.json','utf8')); console.log('Firebase service-account JSON is valid.');"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_EDUWILLS }}

      - name: Install Firebase CLI
        run: npm install -g firebase-tools@latest

      - name: Verify Firebase project access
        run: firebase projects:list --project eduwills --non-interactive >/dev/null

      - name: Set Groq secret
        run: |
          firebase functions:secrets:set GROQ_API_KEY \
            --data-file "$RUNNER_TEMP/groq-api-key.txt" \
            --force \
            --project eduwills \
            --non-interactive

      - name: Set OpenRouter secret
        run: |
          firebase functions:secrets:set OPENROUTER_API_KEY \
            --data-file "$RUNNER_TEMP/openrouter-api-key.txt" \
            --force \
            --project eduwills \
            --non-interactive

      - name: Deploy quiz AI router only
        run: |
          firebase deploy \
            --only functions:quizAiRouter \
            --project eduwills \
            --non-interactive

      - name: Remove temporary credential files
        if: always()
        run: rm -f "$RUNNER_TEMP/firebase-service-account.json" "$RUNNER_TEMP/groq-api-key.txt" "$RUNNER_TEMP/openrouter-api-key.txt"
