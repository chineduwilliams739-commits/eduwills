name: Apply Community UX v2

on:
  push:
    branches: [main]
    paths:
      - 'scripts/upgrade-community-ux-v2.mjs'
      - '.github/workflows/apply-community-ux-v2.yml'
  workflow_dispatch:

jobs:
  upgrade:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply deterministic community UX upgrade
        run: node scripts/upgrade-community-ux-v2.mjs
      - name: Commit generated source
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/dashboard/community/page.tsx app/dashboard/community/group/page.tsx app/dashboard/personal/page.tsx app/dashboard/category/page.tsx
          if git diff --cached --quiet; then echo 'No source changes.'; exit 0; fi
          git commit -m 'Upgrade community workspace and profile UX'
          git push
