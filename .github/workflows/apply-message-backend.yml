name: Apply EDUWILLS message backend

on:
  push:
    branches: [main]
    paths:
      - 'scripts/upgrade-message-backend.mjs'
      - '.github/workflows/apply-message-backend.yml'
  workflow_dispatch:

jobs:
  upgrade:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply backend upgrade
        run: node scripts/upgrade-message-backend.mjs
      - name: Commit generated source
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add firestore.rules functions/index.js
          if git diff --cached --quiet; then echo 'No generated changes.'; exit 0; fi
          git commit -m 'Add unread counters and message permissions'
          git pull --rebase origin main
          git push
