name: Fix Community Chat Search and Profiles

on:
  push:
    branches: [main]
    paths:
      - 'scripts/fix-community-chat-search-and-profiles.mjs'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Apply community chat search and profile repair
        run: node scripts/fix-community-chat-search-and-profiles.mjs

      - name: Commit repaired community chat source
        run: |
          set -euo pipefail
          if git diff --quiet -- app/dashboard/community/chat/page.tsx app/dashboard/personal/page.tsx; then
            echo 'No source changes were needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/dashboard/community/chat/page.tsx app/dashboard/personal/page.tsx
          git commit -m 'Apply community chat search and profile image fixes'
          git push
