name: Deploy EDUWILLS to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Clean previous build output
        run: rm -rf .next out
      - name: Verify repair scripts
        shell: bash
        run: |
          set -euxo pipefail
          test -f app/admin/page.tsx
          test -f scripts/repair-willi-token-admin-final.mjs
          node --check scripts/repair-willi-token-admin-final.mjs
          node --check scripts/repair-willi-token-lifecycle-v2.mjs
          node --check scripts/repair-willi-token-lifecycle-v4.mjs
          node --check scripts/repair-willi-token-runtime-v5.mjs
      - name: Apply EDUWILLS final implementation
        shell: bash
        run: |
          set -euxo pipefail
          run_repair() {
            local script="$1"
            echo "========================================"
            echo "Running repair: $script"
            echo "========================================"
            node "$script"
          }
          run_repair scripts/repair-homepage-seo.mjs
          run_repair scripts/repair-quiz-grounding.mjs
          run_repair scripts/repair-ui-script-syntax.mjs
          run_repair scripts/repair-quiz-final-polish.mjs
          run_repair scripts/repair-quiz-final-behavior.mjs
          run_repair scripts/repair-quiz-admin-latest.mjs
          run_repair scripts/repair-willi-token-lifecycle-v2.mjs
          run_repair scripts/repair-willi-token-lifecycle-v4.mjs
          run_repair scripts/repair-willi-token-runtime-v5.mjs
          run_repair scripts/repair-willi-token-admin-final.mjs
          run_repair scripts/repair-quiz-grounding.mjs
          run_repair scripts/repair-quiz-instructions-result.mjs
      - name: Verify final implementation before build
        shell: bash
        run: |
          set -euxo pipefail
          grep -Fq "const userTokens = (uid: string) =>" app/admin/page.tsx
          grep -Fq "!!e && e.getTime() > Date.now()" app/admin/page.tsx
          grep -Fq "const expiredTokenDocs" app/admin/page.tsx
          grep -Fq "const liveTokenDocs" app/admin/page.tsx
          grep -Fq "deleteDoc(doc(db, 'williTokens', x.id))" app/admin/page.tsx
          grep -Fq "used tokens retained until expiry" scripts/repair-willi-token-admin-final.mjs
      - name: Build application
        env:
          NEXT_PUBLIC_RECAPTCHA_ENTERPRISE_SITE_KEY: ${{ secrets.NEXT_PUBLIC_RECAPTCHA_ENTERPRISE_SITE_KEY }}
        run: npm run build
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
