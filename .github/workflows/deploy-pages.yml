name: Deploy EDUWILLS to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Restore EDUWILLS homepage
        shell: bash
        run: |
          set -euxo pipefail
          node --check scripts/restore-homepage-final.mjs
          node scripts/restore-homepage-final.mjs
      - name: Apply stable EDUWILLS implementation
        shell: bash
        run: |
          set -euxo pipefail
          node --check scripts/implement-education-news-and-quiz-policy.mjs
          node scripts/implement-education-news-and-quiz-policy.mjs
          node --check scripts/publish-education-news.mjs
      - name: Install WilliToken user picker into Admin panel
        shell: bash
        run: |
          set -euxo pipefail
          node --check scripts/repair-willi-token-admin-controls.mjs
          node scripts/repair-willi-token-admin-controls.mjs
      - name: Verify category and WilliToken implementation
        shell: bash
        run: |
          set -euxo pipefail
          node --check scripts/implement-category-switch-and-token-categories.mjs
          node --check scripts/repair-willi-token-admin-controls.mjs
          node --check scripts/repair-willi-token-lifecycle-v4.mjs
          test -f app/admin/page.tsx
          node - <<'NODE'
          const fs = require('fs');
          const admin = fs.readFileSync('app/admin/page.tsx','utf8');
          const categoryScript = fs.readFileSync('scripts/implement-category-switch-and-token-categories.mjs','utf8');
          const lifecycleScript = fs.readFileSync('scripts/repair-willi-token-lifecycle-v4.mjs','utf8');
          if (!admin.includes('CATEGORIES')) throw new Error('Admin category definitions missing');
          if (!admin.includes('selectedCategories')) throw new Error('Admin selected category state missing');
          if (!admin.includes('tokenCategories')) throw new Error('Admin token category selection missing');
          if (!admin.includes('createToken')) throw new Error('WilliToken generator missing');
          if (!admin.includes('categories')) throw new Error('WilliToken category field missing');
          if (!admin.includes('revokeToken')) throw new Error('WilliToken revoke control missing');
          if (!admin.includes('tokenUserSearch')) throw new Error('WilliToken user-picker state missing from Admin source');
          if (!admin.includes('tokenUserMatches')) throw new Error('WilliToken user-picker matching missing from Admin source');
          if (!admin.includes('Find user to generate WilliToken')) throw new Error('WilliToken user-picker UI missing from Admin source');
          if (!categoryScript.includes('Book Learner')) throw new Error('Book Learner category support missing');
          if (!lifecycleScript.includes('expiredTokenDocs')) throw new Error('WilliToken lifecycle cleanup implementation missing');
          console.log('EDUWILLS Admin source verified with the WilliToken user picker installed.');
          NODE
      - name: Build application
        env:
          NEXT_PUBLIC_RECAPTCHA_ENTERPRISE_SITE_KEY: ${{ secrets.NEXT_PUBLIC_RECAPTCHA_ENTERPRISE_SITE_KEY }}
        run: npm run build
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
        id: deployment
