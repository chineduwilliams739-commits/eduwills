name: Deploy EDUWILLS to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Apply requested activation/signup/dashboard repairs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          activation = Path('app/dashboard/activation/page.tsx')
          a = activation.read_text()
          state = " const[user,setUser]=useState<any>(null),[selected,setSelected]=useState<string[]>([]),[country,setCountry]=useState('NG'),[currency,setCurrency]=useState('NGN'),[code,setCode]=useState(''),[message,setMessage]=useState(''),[loading,setLoading]=useState(true),[paying,setPaying]=useState(false),[redeeming,setRedeeming]=useState(false),[success,setSuccess]=useState<{categories:string[];expiresAt:Date}|null>(null),[paymentSuccess,setPaymentSuccess]=useState<{code?:string;emailSent:boolean;emailError?:string}|null>(null),[quote,setQuote]=useState<{localCurrency:string;localAmount:number;paymentCurrency:string;paymentAmount:number;international:boolean}|null>(null);"
          a = re.sub(r" const\[user,setUser=.*?\n const getBackend", state + "\n const getBackend", a, count=1, flags=re.S)
          a = a.replace("const COUNTRIES=[['NG','Nigeria','NGN'],['US','United States','USD'],['GB','United Kingdom','GBP'],['GH','Ghana','GHS'],['KE','Kenya','KES'],['ZA','South Africa','ZAR'],['CI','Côte d’Ivoire','XOF'],['INT','Other country','USD']] as const;", "const COUNTRIES=[['NG','Nigeria','NGN'],['INT','Other countries','USD']] as const;")
          a = a.replace("const CURRENCIES=[['NGN','NGN — Nigerian Naira'],['USD','USD — US Dollar'],['GBP','GBP — British Pound'],['EUR','EUR — Euro'],['GHS','GHS — Ghanaian Cedi'],['KES','KES — Kenyan Shilling'],['ZAR','ZAR — South African Rand'],['XOF','XOF — West African CFA Franc']] as const;", "const CURRENCIES=[['NGN','NGN — Nigerian Naira'],['USD','USD — US Dollar']] as const;")
          a = a.replace("const RATES:Record<string,number>={USD:1,GBP:.75,EUR:.86,GHS:11.2,KES:129,ZAR:17.8,XOF:560,NGN:1550};", "const RATES:Record<string,number>={USD:1,NGN:1550};")
          activation.write_text(a)

          signup = Path('app/signup/page.tsx')
          u = signup.read_text()
          u = u.replace("const options=[{id:'senior',name:'Senior Secondary',price:3000,status:'Coming soon'},{id:'junior',name:'Junior Secondary',price:3000,status:'Coming soon'},{id:'primary',name:'Primary',price:2000,status:'Coming soon'},{id:'book',name:'Book Learner',price:4000,status:'Available now'}];", "const options=[{id:'senior',name:'Senior Secondary',price:3000,status:'Available now'},{id:'junior',name:'Junior Secondary',price:3000,status:'Available now'},{id:'primary',name:'Primary',price:2000,status:'Available now'},{id:'book',name:'Book Learner',price:4000,status:'Available now'}];")
          u = u.replace("const[selected,setSelected]=useState<string[]>(['book']);", "const[selected,setSelected]=useState<string[]>([]);")
          signup.write_text(u)

          dashboard = Path('app/dashboard/page.tsx')
          d = dashboard.read_text()
          d = d.replace('className="mt-7 grid gap-4 sm:grid-cols-2 lg:grid-cols-5"', 'className="mt-7 grid items-start gap-4 sm:grid-cols-2 lg:grid-cols-5"')
          dashboard.write_text(d)
          PY
          grep -q "COUNTRIES=\[\['NG','Nigeria','NGN'\],\['INT','Other countries','USD'\]\]" app/dashboard/activation/page.tsx
          grep -q "CURRENCIES=\[\['NGN','NGN — Nigerian Naira'\],\['USD','USD — US Dollar'\]\]" app/dashboard/activation/page.tsx
          grep -q "\[quote,setQuote\]=useState" app/dashboard/activation/page.tsx
          ! grep -q "Coming soon" app/signup/page.tsx
          grep -q "items-start gap-4 sm:grid-cols-2 lg:grid-cols-5" app/dashboard/page.tsx
          grep -q "no-active-willitoken" lib/aiAccess.ts
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/dashboard/activation/page.tsx app/signup/page.tsx app/dashboard/page.tsx
          if ! git diff --cached --quiet; then
            git commit -m 'Apply requested activation/signup/dashboard repairs [pages-repair]'
            git push origin HEAD:main
          fi
      - name: Harden Admin WilliToken data handling
        run: node scripts/harden-admin-willitoken-data.mjs
      - name: Verify WilliToken physical cleanup
        run: |
          set -euxo pipefail
          grep -q "token.revoked === true" app/admin/page.tsx
          grep -q "token.cancelled === true" app/admin/page.tsx
          grep -q "deleteDoc(doc(db, 'williTokens', token.id))" app/admin/page.tsx
          echo "Revoked, cancelled and expired WilliToken deletion is present in the deployed Admin build."
      - name: Verify multi-book quiz isolation
        run: |
          set -euxo pipefail
          grep -q "evidenceByBook" lib/quizAiClientStable.ts
          grep -q "researchBooks(\[book\])" lib/quizAiClientStable.ts
          grep -q "const baseQuota" lib/quizAiClientStable.ts
          grep -q "local.length < share" lib/quizAiClientStable.ts
          echo "Multi-book evidence isolation and per-book quota checks passed."
      - name: Verify quiz resume cache
        run: |
          set -euxo pipefail
          grep -q "CACHE_VERSION = 'v23-grounded-generator-resume'" lib/quizAiClientStable.ts
          grep -q "writeGenerationCache" lib/quizAiClientStable.ts
          grep -q "onPartial" lib/quizAiClientStable.ts
          grep -q "clearGenerationCache" lib/quizAiClientStable.ts
          echo "Partial grounded-question caching and successful-completion cleanup verified."
      - name: Verify Quiz Studio dropdown implementation
        run: |
          set -euxo pipefail
          grep -q "function QuizDropdown" app/dashboard/quiz/page.tsx
          grep -q "slotOptions" app/dashboard/quiz/page.tsx
          grep -q "onChange={setDuration}" app/dashboard/quiz/page.tsx
          grep -q "onChange={setDifficulty}" app/dashboard/quiz/page.tsx
          echo "Quiz Studio dropdown implementation verified."
      - name: Typecheck
        run: npx tsc --noEmit --pretty false
      - name: Build application
        env:
          NEXT_PUBLIC_RECAPTCHA_ENTERPRISE_SITE_KEY: ${{ secrets.NEXT_PUBLIC_RECAPTCHA_ENTERPRISE_SITE_KEY }}
          NEXT_PUBLIC_PAYSTACK_PUBLIC_KEY: ${{ secrets.NEXT_PUBLIC_PAYSTACK_PUBLIC_KEY }}
        run: npm run build
      - name: Verify production artifact
        run: |
          set -euxo pipefail
          test -d out
          test -f out/index.html
          test -f out/dashboard/index.html
          test -f out/dashboard/activation/index.html
          test -f out/login/index.html
          test -f out/signup/index.html
          echo "Production Pages artifact verified."
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./out
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
