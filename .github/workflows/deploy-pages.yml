name: Deploy EDUWILLS to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Apply stable EDUWILLS implementation
        shell: bash
        run: |
          set -euxo pipefail
          node --check scripts/implement-education-news-and-quiz-policy.mjs
          node scripts/implement-education-news-and-quiz-policy.mjs
          node --check scripts/publish-education-news.mjs
      - name: Apply category switching and category-aware WilliTokens
        shell: bash
        run: |
          set -euxo pipefail
          node --check scripts/implement-category-switch-and-token-categories.mjs
          node scripts/implement-category-switch-and-token-categories.mjs
      - name: Restore WilliToken Admin control centre
        shell: bash
        run: |
          set -euxo pipefail
          node --check scripts/repair-willi-token-admin-controls.mjs
          node scripts/repair-willi-token-admin-controls.mjs
      - name: Verify final implementation
        shell: bash
        run: |
          set -euxo pipefail
          test -f lib/aiAccess.ts
          test -f app/dashboard/ai/page.tsx
          test -f components/EducationFeed.tsx
          test -f public/education-news.json
          node - <<'NODE'
          const fs = require('fs');
          const quiz = fs.readFileSync('app/dashboard/quiz/page.tsx','utf8');
          const client = fs.readFileSync('lib/quizAiClient.ts','utf8');
          const dashboard = fs.readFileSync('app/dashboard/page.tsx','utf8');
          const personal = fs.readFileSync('app/dashboard/personal/page.tsx','utf8');
          const admin = fs.readFileSync('app/admin/page.tsx','utf8');
          if (!client.includes('const CACHE=')) throw new Error('Quiz cache namespace missing');
          if (!client.includes('readSharedCache')) throw new Error('Shared cache reader missing');
          if (!client.includes('allocation=selected.map')) throw new Error('Multi-book allocation missing');
          if (!client.includes('BOOK_KNOWLEDGE_PACKS')) throw new Error('Broadened book knowledge packs missing');
          if (!client.includes('The Lekki Headmaster')) throw new Error('Lekki Headmaster knowledge pack missing');
          if (!client.includes('Sànyà')) throw new Error('Sànyà knowledge pack missing');
          if (!quiz.includes('MIN_QUIZ_DURATION_MINUTES = 5')) throw new Error('Five-minute minimum missing');
          if (!quiz.includes('Math.max(MIN_QUIZ_DURATION_MINUTES')) throw new Error('Five-minute duration enforcement missing');
          if (!quiz.includes('function Menu({label,value,options,onChange}')) throw new Error('Quiz Studio custom menus missing');
          if (!quiz.includes('{value:"5",label:"5 minutes"}')) throw new Error('Five-minute menu option missing');
          if (!dashboard.includes("import EducationFeed from '@/components/EducationFeed';")) throw new Error('Dashboard education feed import missing');
          if (!dashboard.includes('<EducationFeed />')) throw new Error('Dashboard education feed missing');
          if (!dashboard.includes('activeCategory')) throw new Error('Dashboard active category wiring missing');
          if (!dashboard.includes('Switch category')) throw new Error('Dashboard category switch entry missing');
          if (!personal.includes('Switch EDUWILLS category')) throw new Error('Personal category switch UI missing');
          if (!personal.includes('activeCategory')) throw new Error('Active category persistence missing');
          if (!personal.includes('window.location.assign(`${BASE}/dashboard/?category=')) throw new Error('Category switch dashboard redirect missing');
          if (!admin.includes('tokenCategories')) throw new Error('Admin category-aware token selection missing');
          if (!admin.includes('categories: issueCategories')) throw new Error('Token category linkage missing');
          if (!admin.includes('WilliToken Control Centre')) throw new Error('WilliToken control centre missing');
          if (!admin.includes('const revokeToken = async')) throw new Error('WilliToken revoke action missing');
          if (!admin.includes('Redeemed · active')) throw new Error('WilliToken redemption status missing');
          if (!admin.includes('expiredTokenDocs')) throw new Error('WilliToken expiry cleanup missing');
          console.log('EDUWILLS stable implementation verification passed');
          NODE
      - name: Build application
        env:
          NEXT_PUBLIC_RECAPTCHA_ENTERPRISE_SITE_KEY: ${{ secrets.NEXT_PUBLIC_RECAPTCHA_ENTERPRISE_SITE_KEY }}
        run: npm run build
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
        id: deployment
