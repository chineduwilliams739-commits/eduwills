name: Deploy EDUWILLS to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  NEXT_PUBLIC_RECAPTCHA_ENTERPRISE_SITE_KEY: ${{ vars.NEXT_PUBLIC_RECAPTCHA_ENTERPRISE_SITE_KEY || secrets.NEXT_PUBLIC_RECAPTCHA_ENTERPRISE_SITE_KEY }}

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply exact book identity and AI display repair
        shell: python
        run: |
          from pathlib import Path
          quiz=Path('lib/quizAiClient.ts')
          text=quiz.read_text(encoding='utf-8')
          text=text.replace("'sanya': ['Sànyà is a Nigerian literary work by Oyin Olugbile.'],", "'sanya': ['Sànyà (Sanya) is the 2022 debut novel by Nigerian author Oyin Olugbile, published by Masobe Books.','The exact book is a mythological fantasy / fiction retelling of Yoruba mythology, reimagining the story and legacy of Ṣàngó through a female protagonist named Sànyà.','Sànyà grows up in a village and has a beloved brother named Dada and an aunt named Abike.','Sànyà is connected to an ancient prophecy concerning her future, powers, warrior identity and leadership.','Ajoke and Aganju are Sànyà’s parents; the prophecy they receive concerns a mighty warrior and leader and they did not expect the foretold warrior king to be a girl.','Dada is Sànyà’s older brother; he is physically weak but highly intelligent and gifted with seeing into the future.','The novel includes dangerous love, family conflict, identity, ancestry, Òrìsà and a deadly war.','The exact book is not Sanya Bay, Sanya Island, a mountain, a place, or another work named Sanya.','Masobe Books identifies Sànyà as Oyin Olugbile’s debut novel, released on December 2, 2022, with 400 pages and ISBN 978-978-998-791-7.','The novel won the Nigeria Prize for Literature in 2025.'],")
          old="function sourceMatchesBook(text:string,book:QuizBook){const n=normalize(text),title=normalize(book.title),author=normalize(book.author),titleWords=title.split(' ').filter(w=>w.length>3);const hits=titleWords.filter(w=>n.includes(w)).length;return hits>=Math.max(1,Math.ceil(titleWords.length*0.45))||n.includes(author)}"
          new="function sourceMatchesBook(text:string,book:QuizBook){const n=normalize(text),title=normalize(book.title),author=normalize(book.author);if(title==='sanya'){return n.includes('oyin olugbile')||((n.includes('sanya')||n.includes('sanya novel'))&&(n.includes('dada')||n.includes('ajoke')||n.includes('aganju')||n.includes('sango')||n.includes('yoruba')||n.includes('orisa')||n.includes('olugbile')))}const titleWords=title.split(' ').filter(w=>w.length>3);const hits=titleWords.filter(w=>n.includes(w)).length;return hits>=Math.max(1,Math.ceil(titleWords.length*0.45))||n.includes(author)}"
          if old not in text: raise SystemExit('source matcher not found')
          text=text.replace(old,new)
          needle="Research the exact book \"${book.title}\" by ${book.author} for an academic quiz. Use Google Search grounding and distinguish this exact book from similarly named works."
          replacement="Research the exact book \"${book.title}\" by ${book.author} for an academic quiz. Use Google Search grounding and distinguish this exact book from similarly named works. If the book is Sànyà/Sanya by Oyin Olugbile, ONLY research the 2022 Masobe Books novel by Oyin Olugbile; completely ignore Sanya Mountain, Sanya Bay, Sanya Island, locations, travel pages, weather, geography, hotels, and every other unrelated Sanya."
          if needle not in text: raise SystemExit('research prompt not found')
          text=text.replace(needle,replacement)
          text=text.replace("const CACHE_VERSION = 'v7-direct-content-engine';","const CACHE_VERSION = 'v8-exact-book-identity-and-content';")
          cleaner="function cleanAiText(value:string):string{return String(value||'').replace(/```(?:markdown|md|text|plain)?/gi,'').replace(/```/g,'').replace(/^\\s*[#>*-]+\\s?/gm,'').replace(/\\*\\*(.*?)\\*\\*/g,'$1').replace(/__(.*?)__/g,'$1').replace(/`([^`]+)`/g,'$1').replace(/\\s+\\n/g,'\\n').replace(/\\n{3,}/g,'\\n\\n').trim()}\\n"
          if 'function cleanAiText(value:string)' not in text:
            marker='function extractJson(text: string): any {'
            if marker not in text: raise SystemExit('extractJson marker not found')
            text=text.replace(marker,cleaner+marker,1)
          text=text.replace("const r=await withTimeout(fallbackModel.generateContent(prompt),15000),text=r.response.text().trim();storageSet(key,text,QUIZ_TTL);return text","const r=await withTimeout(fallbackModel.generateContent(prompt),15000),text=cleanAiText(r.response.text());storageSet(key,text,QUIZ_TTL);return text")
          text=text.replace("const r=await withTimeout(model.generateContent(prompt),15000),text=r.response.text().trim();storageSet(key,text,QUIZ_TTL);return text","const r=await withTimeout(model.generateContent(prompt),15000),text=cleanAiText(r.response.text());storageSet(key,text,QUIZ_TTL);return text")
          text=text.replace("const r=await withTimeout(remarksModel.generateContent(prompt),12000),text=r.response.text().trim();if(!text)throw new Error('Empty AI remark');","const r=await withTimeout(remarksModel.generateContent(prompt),12000),text=cleanAiText(r.response.text());if(!text)throw new Error('Empty AI remark');")
          quiz.write_text(text,encoding='utf-8')

          history=Path('app/dashboard/history/page.tsx')
          h=history.read_text(encoding='utf-8')
          hmarker="const elapsedText=(n:any)=>{const s=Math.max(0,Number(n||0));return s>=60?`${Math.floor(s/60)}m ${s%60}s`:`${s}s`};"
          hclean="const cleanAiText=(value:any)=>String(value||'').replace(/```(?:markdown|md|text|plain)?/gi,'').replace(/```/g,'').replace(/^\\s*[#>*-]+\\s?/gm,'').replace(/\\*\\*(.*?)\\*\\*/g,'$1').replace(/__(.*?)__/g,'$1').replace(/`([^`]+)`/g,'$1').replace(/\\s+\\n/g,'\\n').replace(/\\n{3,}/g,'\\n\\n').trim();"
          if 'const cleanAiText=(value:any)' not in h:
            if hmarker not in h: raise SystemExit('history marker not found')
            h=h.replace(hmarker,hmarker+hclean,1)
          h=h.replace("const text=(await res.text()).trim();setAiFeedback(text);","const text=cleanAiText(await res.text());setAiFeedback(text);")
          h=h.replace("const text=(await res.text()).trim();const next={...why,[key]:text};","const text=cleanAiText(await res.text());const next={...why,[key]:text};")
          h=h.replace("setAiFeedback(String(found?.aiFeedback||''));","setAiFeedback(cleanAiText(found?.aiFeedback||''));")
          h=h.replace("setAiFeedback(String(x.aiFeedback||''));","setAiFeedback(cleanAiText(x.aiFeedback||''));")
          history.write_text(h,encoding='utf-8')
          print('Build-time repair applied.')

      - name: Verify App Check configuration
        run: |
          if [ -z "$NEXT_PUBLIC_RECAPTCHA_ENTERPRISE_SITE_KEY" ]; then
            echo "ERROR: NEXT_PUBLIC_RECAPTCHA_ENTERPRISE_SITE_KEY is not available to this workflow."
            echo "Add it under Settings > Secrets and variables > Actions > Variables, or under the github-pages environment Variables."
            exit 1
          fi
          echo "Firebase App Check site key is configured."

      - name: Verify quiz exit protection is present
        run: |
          if ! grep -R "leaveAttempts" -n app pages components 2>/dev/null | head -1; then
            echo "ERROR: quiz exit protection code was not found in the source tree."
            exit 1
          fi
          echo "Quiz exit protection is present in the source tree."

      - name: Verify Sanya identity and AI cleanup
        run: |
          grep -q "The exact book is not Sanya Bay" lib/quizAiClient.ts
          grep -q "ONLY research the 2022 Masobe Books novel" lib/quizAiClient.ts
          grep -q "v8-exact-book-identity-and-content" lib/quizAiClient.ts
          grep -q "function cleanAiText" lib/quizAiClient.ts
          grep -q "const cleanAiText" app/dashboard/history/page.tsx
          echo "Sanya and AI feedback verification passed."

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build static site
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
