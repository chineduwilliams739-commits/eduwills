name: Deploy EDUWILLS to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Clean previous build output
        run: rm -rf .next out

      - name: Verify repair scripts
        shell: bash
        run: |
          set -euo pipefail
          test -f app/page.tsx
          test -f app/dashboard/quiz/page.tsx
          test -f app/admin/page.tsx
          test -f lib/quizAiClient.ts
          test -f lib/verifiedBookGrounding.ts
          test -f scripts/repair-homepage-seo.mjs
          test -f scripts/repair-quiz-grounding.mjs
          test -f scripts/repair-quiz-final-polish.mjs
          test -f scripts/repair-quiz-final-behavior.mjs
          test -f scripts/repair-quiz-admin-latest.mjs
          test -f scripts/repair-ui-script-syntax.mjs
          test -f scripts/repair-quiz-instructions-result.mjs
          node --check scripts/repair-homepage-seo.mjs
          node --check scripts/repair-quiz-grounding.mjs
          node --check scripts/repair-quiz-final-polish.mjs
          node --check scripts/repair-quiz-final-behavior.mjs
          node --check scripts/repair-quiz-admin-latest.mjs
          node --check scripts/repair-ui-script-syntax.mjs
          node --check scripts/repair-quiz-instructions-result.mjs

      - name: Apply EDUWILLS final implementation
        shell: bash
        run: |
          set -euo pipefail
          node scripts/repair-homepage-seo.mjs
          node scripts/repair-quiz-grounding.mjs
          node scripts/repair-ui-script-syntax.mjs
          node scripts/repair-quiz-final-polish.mjs
          node scripts/repair-quiz-final-behavior.mjs
          node scripts/repair-quiz-admin-latest.mjs
          # Grounding is deliberately re-applied before the final instruction/export repair
          # so exact-book validation remains intact while the final prompt and result export are applied last.
          node scripts/repair-quiz-grounding.mjs
          node scripts/repair-quiz-instructions-result.mjs

      - name: Verify final implementation before build
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "EDUWILLS_SEO_CONTENT_V1" app/page.tsx
          grep -Fq "AI quiz generator for" app/page.tsx
          grep -Fq "function Menu({" app/dashboard/quiz/page.tsx
          grep -Fq "Swipe sideways to navigate questions" app/dashboard/quiz/page.tsx
          grep -Fq "Leave this quiz?" app/dashboard/quiz/page.tsx
          grep -Fq "answers.filter((x) => x !== undefined).length} answered questions" app/dashboard/quiz/page.tsx
          grep -Fq "Explain why I failed this" app/dashboard/quiz/page.tsx
          grep -Fq "Every question" app/dashboard/quiz/page.tsx
          grep -Fq "EDUWILLS AI Review" app/dashboard/quiz/page.tsx
          grep -Fq "setTimeout(() => submitQuiz(true), 0)" app/dashboard/quiz/page.tsx
          grep -Fq "verifiedBookGrounding" lib/quizAiClient.ts
          grep -Fq "groundedForBooks" lib/quizAiClient.ts
          grep -Fq "verifiedResearch(books)" lib/quizAiClient.ts
          grep -Fq "v22-strict-instructions-quiz" lib/quizAiClient.ts
          grep -Fq "STRICTLY MANDATORY" lib/quizAiClient.ts
          grep -Fq "resultFileName" app/dashboard/quiz/page.tsx
          grep -Fq "EDUWILLS-' + suffix" app/dashboard/quiz/page.tsx
          grep -Fq "SMART QUIZ • LEARNING RESULT" app/dashboard/quiz/page.tsx
          grep -Fq "Math.max(5, Number(duration) || 5)" app/dashboard/quiz/page.tsx
          grep -Fq "Custom duration…" app/admin/page.tsx
          grep -Fq "manualDurationMs" app/admin/page.tsx
          grep -Fq "absolute left-5" app/dashboard/quiz/page.tsx
          if grep -Fq '<select value={duration}' app/dashboard/quiz/page.tsx; then
            echo "ERROR: old unstyled duration dropdown is still present"
            exit 1
          fi
          if grep -Fq '<select value={difficulty}' app/dashboard/quiz/page.tsx; then
            echo "ERROR: old unstyled difficulty dropdown is still present"
            exit 1
          fi
          echo "EDUWILLS final UI, SEO, hard exact-book grounding, strict instruction contract, unique styled result export, stale-cache invalidation, persistent timer, 5-minute minimum and manual WilliToken duration are present in the build source."

      - name: Build application
        env:
          NEXT_PUBLIC_RECAPTCHA_ENTERPRISE_SITE_KEY: ${{ secrets.NEXT_PUBLIC_RECAPTCHA_ENTERPRISE_SITE_KEY }}
        run: npm run build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
