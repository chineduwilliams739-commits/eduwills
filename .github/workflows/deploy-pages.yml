name: Deploy EDUWILLS to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Restore EDUWILLS homepage
        run: |
          set -euxo pipefail
          node --check scripts/restore-homepage-final.mjs
          node scripts/restore-homepage-final.mjs
      - name: Apply stable EDUWILLS implementation
        run: |
          set -euxo pipefail
          node --check scripts/implement-education-news-and-quiz-policy.mjs
          node scripts/implement-education-news-and-quiz-policy.mjs
          node --check scripts/publish-education-news.mjs
      - name: Apply safe Admin WilliToken implementation
        run: python3 scripts/apply-admin-willi-token-ui.py
      - name: Apply quiz and EDUWILLS AI reliability implementation
        run: python3 scripts/apply-quiz-ai-reliability-v2.py
      - name: Restore authoritative Quiz Studio source
        run: git checkout -- app/dashboard/quiz/page.tsx
      - name: Apply Book Learner cache-first generation fix
        run: |
          set -euxo pipefail
          node --check scripts/fix-book-learner-quiz-generation.mjs
          node scripts/fix-book-learner-quiz-generation.mjs
          if grep -q "title:'Selected book'" lib/quizAiClient.ts; then exit 1; fi
      - name: Apply Book Learner resumable runtime v4
        run: |
          set -euxo pipefail
          node --check scripts/fix-book-learner-quiz-runtime-v3.mjs
          node scripts/fix-book-learner-quiz-runtime-v3.mjs
          node - <<'NODE'
          const fs=require('fs');
          const ai=fs.readFileSync('lib/quizAiClient.ts','utf8');
          const q=fs.readFileSync('app/dashboard/quiz/page.tsx','utf8');
          if(ai.includes("title:'Selected book'")) throw new Error('Obsolete selected-book fallback remains');
          if(!ai.includes('BOOK_SELECTION_REQUIRED')) throw new Error('Strict book validation missing');
          if(!q.includes('async function retryGeneration()')) throw new Error('Retry handler missing');
          NODE
      - name: Keep Book Learner generation visible on failure
        run: |
          set -euxo pipefail
          node --check scripts/keep-book-quiz-generation-visible.mjs
          node scripts/keep-book-quiz-generation-visible.mjs
      - name: Improve Book Learner grounding and Quiz Studio interface
        run: |
          set -euxo pipefail
          node --check scripts/fix-book-learner-quiz-v5.mjs
          node scripts/fix-book-learner-quiz-v5.mjs
      - name: Apply professional Quiz Studio exam security and styling
        run: |
          set -euxo pipefail
          node --check scripts/apply-quiz-exam-security-and-ui-v1.mjs
          node scripts/apply-quiz-exam-security-and-ui-v1.mjs
      - name: Restore canonical quiz sources after all mutating repair scripts
        run: |
          set -euxo pipefail
          git fetch origin 96fb0cf4bf2a8797337ba9bab4bc99f350424f39 3c44582f8dc7cb2aeb3a0806cd058da2d4e795a7
          git checkout 96fb0cf4bf2a8797337ba9bab4bc99f350424f39 -- lib/quizAiClient.ts
          git checkout 3c44582f8dc7cb2aeb3a0806cd058da2d4e795a7 -- app/dashboard/quiz/page.tsx
      - name: Restore premium styled dropdowns safely
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('app/dashboard/quiz/page.tsx')
          s=p.read_text(encoding='utf-8')
          s=re.sub(r'\\+(?=[<>`])','',s)
          cls='appearance-none w-full rounded-2xl border border-indigo-100 bg-gradient-to-r from-white via-slate-50 to-cyan-50 px-4 py-3.5 pr-12 font-black text-slate-700 shadow-sm outline-none transition-all duration-200 hover:border-indigo-300 hover:shadow-md focus:border-indigo-500 focus:ring-4 focus:ring-indigo-100'
          def style(m):
              attrs=m.group(1)
              if 'data-eduwills-styled' in attrs:
                  return m.group(0)
              cm=re.search(r'className="([^"]*)"', attrs)
              if cm:
                  attrs=attrs[:cm.start(1)]+cm.group(1)+' '+cls+attrs[cm.end(1):]
              else:
                  attrs+=' className="'+cls+'"'
              attrs+=' data-eduwills-styled="true"'
              return '<select'+attrs+'>'
          s=re.sub(r'<select\b([^>]*)>',style,s)
          p.write_text(s,encoding='utf-8')
          PY
          git diff --check
      - name: Validate final quiz implementation
        run: |
          set -euxo pipefail
          npx tsc --noEmit --pretty false
          grep -q 'v20-cache-first-per-book' lib/quizAiClient.ts
          grep -q 'data-eduwills-styled' app/dashboard/quiz/page.tsx
          grep -q 'return <main' app/dashboard/quiz/page.tsx
      - name: Build application
        env:
          NEXT_PUBLIC_RECAPTCHA_ENTERPRISE_SITE_KEY: ${{ secrets.NEXT_PUBLIC_RECAPTCHA_ENTERPRISE_SITE_KEY }}
        run: npm run build
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out
      - name: Commit generated repairs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then exit 0; fi
          git add app/dashboard/quiz/page.tsx lib/quizAiClient.ts
          git commit -m "restore stable quiz generation and dropdown styling"
          git push
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
        id: deployment
