name: Deploy EDUWILLS to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install

      - name: Verify required project files
        shell: bash
        run: |
          set -euo pipefail
          test -f app/dashboard/quiz/page.tsx
          test -f lib/quizAiClient.ts
          test -f scripts/repair-homepage-seo.mjs
          test -f scripts/repair-quiz-grounding.mjs
          test -f scripts/repair-quiz-ui-free-count.mjs
          node --check scripts/repair-homepage-seo.mjs
          node --check scripts/repair-quiz-grounding.mjs
          node --check scripts/repair-quiz-ui-free-count.mjs
          echo "Required EduWills files verified."

      - name: Apply final Quiz Studio repair
        run: |
          node scripts/repair-homepage-seo.mjs
          node scripts/repair-quiz-grounding.mjs
          node scripts/repair-quiz-ui-free-count.mjs

      - name: Build application
        env:
          NEXT_PUBLIC_RECAPTCHA_ENTERPRISE_SITE_KEY: ${{ secrets.NEXT_PUBLIC_RECAPTCHA_ENTERPRISE_SITE_KEY }}
        run: npm run build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4