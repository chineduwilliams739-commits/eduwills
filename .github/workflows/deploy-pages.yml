name: Deploy EDUWILLS to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Restore EDUWILLS homepage
        run: |
          set -euxo pipefail
          node --check scripts/restore-homepage-final.mjs
          node scripts/restore-homepage-final.mjs
      - name: Apply stable EDUWILLS implementation
        run: |
          set -euxo pipefail
          node --check scripts/implement-education-news-and-quiz-policy.mjs
          node scripts/implement-education-news-and-quiz-policy.mjs
          node --check scripts/publish-education-news.mjs
      - name: Apply safe Admin WilliToken implementation
        run: python3 scripts/apply-admin-willi-token-ui.py
      - name: Apply quiz and EDUWILLS AI reliability implementation
        run: python3 scripts/apply-quiz-ai-reliability-v2.py
      - name: Restore authoritative Quiz Studio source
        run: git checkout -- app/dashboard/quiz/page.tsx
      - name: Apply Book Learner cache-first generation fix
        run: |
          set -euxo pipefail
          node --check scripts/fix-book-learner-quiz-generation.mjs
          node scripts/fix-book-learner-quiz-generation.mjs
          if grep -q "title:'Selected book'" lib/quizAiClient.ts; then exit 1; fi
      - name: Apply Book Learner resumable runtime v4
        run: |
          set -euxo pipefail
          node --check scripts/fix-book-learner-quiz-runtime-v3.mjs
          node scripts/fix-book-learner-quiz-runtime-v3.mjs
          node - <<'NODE'
          const fs=require('fs');
          const ai=fs.readFileSync('lib/quizAiClient.ts','utf8');
          const q=fs.readFileSync('app/dashboard/quiz/page.tsx','utf8');
          if(ai.includes("title:'Selected book'")) throw new Error('Obsolete selected-book fallback remains');
          if(!ai.includes('BOOK_SELECTION_REQUIRED')) throw new Error('Strict book validation missing');
          if(!ai.includes('Math.min(20,remaining)') && !ai.includes('Math.min(20, remaining)')) throw new Error('20-question batch generation missing');
          if(!ai.includes('writeSharedCache(key,accepted)') && !ai.includes('writeSharedCache(key, accepted)')) throw new Error('Partial-question cache write missing');
          if(!ai.includes('AI_GENERATION_FAILED:')) throw new Error('Useful AI error propagation missing');
          if(!q.includes('async function retryGeneration()')) throw new Error('Retry handler missing');
          NODE
      - name: Keep Book Learner generation visible on failure
        run: |
          set -euxo pipefail
          node --check scripts/keep-book-quiz-generation-visible.mjs
          node scripts/keep-book-quiz-generation-visible.mjs
          if ! grep -q 'retryGeneration' app/dashboard/quiz/page.tsx; then exit 1; fi
      - name: Improve Book Learner grounding and Quiz Studio interface
        run: |
          set -euxo pipefail
          node --check scripts/fix-book-learner-quiz-v5.mjs
          node scripts/fix-book-learner-quiz-v5.mjs
          node - <<'NODE'
          const fs=require('fs');
          const ai=fs.readFileSync('lib/quizAiClient.ts','utf8');
          const q=fs.readFileSync('app/dashboard/quiz/page.tsx','utf8');
          if(!ai.includes('CHARACTER_GROUNDING_RULE')) throw new Error('Book character grounding guard missing');
          if(!ai.includes('EXACT-BOOK RESEARCH EVIDENCE')) throw new Error('Exact-book evidence grounding missing');
          const uiSignals=['question','options','progress','retryGeneration','quizError'];
          const missing=uiSignals.filter(s=>!q.toLowerCase().includes(s.toLowerCase()));
          if(missing.length) throw new Error('Quiz Studio functional UI signals missing: '+missing.join(', '));
          NODE
      - name: Apply professional Quiz Studio exam security and styling
        run: |
          set -euxo pipefail
          node --check scripts/apply-quiz-exam-security-and-ui-v1.mjs
          node scripts/apply-quiz-exam-security-and-ui-v1.mjs
          node - <<'NODE'
          const fs=require('fs'); const q=fs.readFileSync('app/dashboard/quiz/page.tsx','utf8');
          if(!q.includes('EDUWILLS_EXAM_SECURITY_V2')) throw new Error('Exam security marker missing');
          if(!q.includes('visibilitychange')) throw new Error('Tab-switch warning missing');
          if(!q.includes("window.addEventListener('blur'")) throw new Error('Leave-window detection missing');
          if(!q.includes('submitQuiz(true)')) throw new Error('Automatic submission missing');
          if(!q.includes('Choose the best answer.')) throw new Error('Professional question interface missing');
          NODE
      - name: Canonicalize Quiz Studio source
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('app/dashboard/quiz/page.tsx')
          s=p.read_text(encoding='utf-8')
          # Some historical patch generators persisted literal backslashes before JSX/template punctuation.
          # Remove them globally before the source reaches Next.js; these are never valid JSX syntax.
          s=re.sub(r'\\+', '', s) if False else s
          s=re.sub(r'\\+(?=</?[A-Za-z])', '', s)
          s=re.sub(r'\\+(?=`)', '', s)
          p.write_text(s, encoding='utf-8')
          s=p.read_text(encoding='utf-8')
          if re.search(r'\\+(?=</?[A-Za-z])', s): raise SystemExit('Escaped JSX remains')
          if re.search(r'\\+(?=`)', s): raise SystemExit('Escaped template literal remains')
          if not re.search(r'return\s+<main\b', s): raise SystemExit('Quiz page does not contain real JSX main')
          print('Canonical Quiz Studio JSX verified.')
          PY
          git diff --check
      - name: Verify Quiz source immediately before build
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('app/dashboard/quiz/page.tsx').read_text(encoding='utf-8')
          bad=re.findall(r'\\+(?=</?[A-Za-z])',s)
          if bad: raise SystemExit('Invalid escaped JSX remains immediately before build')
          if not re.search(r'return\s+<main\b',s): raise SystemExit('Real JSX main missing immediately before build')
          print('Final Quiz Studio source is clean JSX.')
          PY
      - name: Build application
        env:
          NEXT_PUBLIC_RECAPTCHA_ENTERPRISE_SITE_KEY: ${{ secrets.NEXT_PUBLIC_RECAPTCHA_ENTERPRISE_SITE_KEY }}
        run: npm run build
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
        id: deployment
