name: Deploy EDUWILLS to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  NEXT_PUBLIC_RECAPTCHA_ENTERPRISE_SITE_KEY: ${{ vars.NEXT_PUBLIC_RECAPTCHA_ENTERPRISE_SITE_KEY || secrets.NEXT_PUBLIC_RECAPTCHA_ENTERPRISE_SITE_KEY }}

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply exact book identity and AI display repair
        shell: python
        run: |
          from pathlib import Path
          import re

          quiz = Path('lib/quizAiClient.ts')
          text = quiz.read_text(encoding='utf-8')

          # Never depend on an old exact source string. Earlier repair workflows
          # failed because the source had already changed between repairs.
          sanya_facts = "'sanya': [\n    'Sànyà (Sanya) is the 2022 debut novel by Nigerian author Oyin Olugbile, published by Masobe Books.',\n    'The exact book is a mythological fantasy/fiction retelling of Yoruba mythology and reimagines the story and legacy of Ṣàngó through the female protagonist Sànyà.',\n    'Sànyà grows up in a village and has an older brother named Dada and an aunt named Abike.',\n    'Ajoke and Aganju are Sànyà’s parents; the prophecy they receive concerns a mighty warrior and leader and they did not expect the foretold warrior to be a girl.',\n    'Dada is Sànyà’s older brother; he is physically weak but highly intelligent and gifted with seeing into the future.',\n    'The novel includes family conflict, identity, ancestry, Òrìsà, dangerous love and a deadly war.',\n    'The exact book is NOT Sanya Bay, Sanya Island, Sanya Mountain, a travel destination, geography, weather page, hotel, or another unrelated work named Sanya.',\n    'Masobe Books identifies Sànyà as Oyin Olugbile’s debut novel, released on December 2, 2022.',\n  ],"
          sanya_pattern = r"['\"]sanya['\"]\s*:\s*\[.*?\],\n\s*['\"]scars['\"]\s*:"
          text, count = re.subn(sanya_pattern, sanya_facts + "\n  'scars':", text, count=1, flags=re.S)
          if count != 1:
              raise SystemExit('Could not locate the curated Sanya entry.')

          # Make Sanya source matching strict. This prevents Sanya Mountain/Bay/etc.
          # from entering the book research dossier.
          matcher = """function sourceMatchesBook(text:string,book:QuizBook){const n=normalize(text),title=normalize(book.title),author=normalize(book.author);if(title==='sanya'){return n.includes('oyin olugbile')||((n.includes('sanya')||n.includes('sanya novel'))&&(n.includes('dada')||n.includes('ajoke')||n.includes('aganju')||n.includes('sango')||n.includes('yoruba')||n.includes('orisa')||n.includes('olugbile')))}const titleWords=title.split(' ').filter(w=>w.length>3);const hits=titleWords.filter(w=>n.includes(w)).length;return hits>=Math.max(1,Math.ceil(titleWords.length*0.45))||n.includes(author)}"""
          text, count = re.subn(r"function sourceMatchesBook\(text:string,book:QuizBook\)\{.*?\}\nexport async function researchBooks", matcher + "\nexport async function researchBooks", text, count=1, flags=re.S)
          if count != 1:
              raise SystemExit('Could not locate sourceMatchesBook.')

          # Add the Sanya identity guard to the existing Gemini research request
          # without assuming the exact wording of the current prompt.
          guard = "researchModel.generateContent(prompt + (normalize(book.title)==='sanya' ? ' IMPORTANT BOOK IDENTITY RULE: Research ONLY Sànyà/Sanya, the 2022 Masobe Books novel by Oyin Olugbile. Completely ignore Sanya Mountain, Sanya Bay, Sanya Island, geography, travel, hotels, weather and every unrelated work or place named Sanya.' : ''))"
          text, count = re.subn(r"researchModel\.generateContent\(prompt\)", guard, text, count=1)
          if count != 1:
              raise SystemExit('Could not locate Gemini research call.')

          # Version all old client caches out.
          text = re.sub(r"const CACHE_VERSION = ['\"][^'\"]+['\"];", "const CACHE_VERSION = 'v9-sanya-identity-and-ai-cleanup';", text, count=1)

          # Clean AI prose at the client boundary so Markdown/code fences cannot
          # leak into the test overview or failure explanation UI.
          if 'function cleanAiText(value:string)' not in text:
              cleaner = "function cleanAiText(value:string):string{return String(value||'').replace(/```(?:markdown|md|text|plain)?/gi,'').replace(/```/g,'').replace(/^\\s*[#>*-]+\\s?/gm,'').replace(/\\*\\*(.*?)\\*\\*/g,'$1').replace(/__(.*?)__/g,'$1').replace(/`([^`]+)`/g,'$1').replace(/\\s+\\n/g,'\\n').replace(/\\n{3,}/g,'\\n\\n').trim()}\n"
              marker = 'function extractJson(text: string): any {'
              if marker not in text:
                  raise SystemExit('Could not locate extractJson.')
              text = text.replace(marker, cleaner + marker, 1)

          # Clean all direct Gemini text results that currently use trim().
          text = text.replace('r.response.text().trim()', 'cleanAiText(r.response.text())')
          quiz.write_text(text, encoding='utf-8')

          # History/test-overview page: clean both fresh AI responses and stored
          # historical feedback when rendered.
          history = Path('app/dashboard/history/page.tsx')
          h = history.read_text(encoding='utf-8')
          if 'const cleanAiText=(value:any)' not in h:
              hclean = "const cleanAiText=(value:any)=>String(value||'').replace(/```(?:markdown|md|text|plain)?/gi,'').replace(/```/g,'').replace(/^\\s*[#>*-]+\\s?/gm,'').replace(/\\*\\*(.*?)\\*\\*/g,'$1').replace(/__(.*?)__/g,'$1').replace(/`([^`]+)`/g,'$1').replace(/\\s+\\n/g,'\\n').replace(/\\n{3,}/g,'\\n\\n').trim();"
              # Put it before the first React component/export declaration.
              m = re.search(r"\n(export (?:default )?function|const [A-Za-z0-9_]+\s*=\s*\()", h)
              if not m:
                  raise SystemExit('Could not locate a safe insertion point in history page.')
              h = h[:m.start()] + '\n' + hclean + h[m.start():]
          h = re.sub(r"const text=\(await res\.text\(\)\)\.trim\(\);setAiFeedback\(text\);", "const text=cleanAiText(await res.text());setAiFeedback(text);", h)
          h = re.sub(r"const text=\(await res\.text\(\)\)\.trim\(\);const next=\{\.\.\.why,\[key\]:text\};", "const text=cleanAiText(await res.text());const next={...why,[key]:text};", h)
          h = h.replace("setAiFeedback(String(found?.aiFeedback||''));", "setAiFeedback(cleanAiText(found?.aiFeedback||''));")
          h = h.replace("setAiFeedback(String(x.aiFeedback||''));", "setAiFeedback(cleanAiText(x.aiFeedback||''));")
          history.write_text(h, encoding='utf-8')
          print('Exact Sanya identity and AI text repair applied successfully.')

      - name: Verify App Check configuration
        run: |
          if [ -z "$NEXT_PUBLIC_RECAPTCHA_ENTERPRISE_SITE_KEY" ]; then
            echo "ERROR: NEXT_PUBLIC_RECAPTCHA_ENTERPRISE_SITE_KEY is not available to this workflow."
            echo "Add it under Settings > Secrets and variables > Actions > Variables, or under the github-pages environment Variables."
            exit 1
          fi
          echo "Firebase App Check site key is configured."

      - name: Verify quiz exit protection is present
        run: |
          if ! grep -R "leaveAttempts" -n app pages components 2>/dev/null | head -1; then
            echo "ERROR: quiz exit protection code was not found in the source tree."
            exit 1
          fi
          echo "Quiz exit protection is present in the source tree."

      - name: Verify Sanya identity and AI cleanup
        run: |
          grep -q "Sanya Mountain" lib/quizAiClient.ts
          grep -q "Oyin Olugbile" lib/quizAiClient.ts
          grep -q "v9-sanya-identity-and-ai-cleanup" lib/quizAiClient.ts
          grep -q "function cleanAiText" lib/quizAiClient.ts
          grep -q "const cleanAiText" app/dashboard/history/page.tsx
          echo "Sanya identity and AI feedback verification passed."

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build static site
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
