name: Deploy EDUWILLS to GitHub Pages
# status-repair-v6

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Apply dashboard Personal and news layout repair
        run: node scripts/repair-activation-news.mjs
      - name: Apply WilliToken payment and activation success UI repair
        run: node scripts/repair-activation-success-ui.mjs
      - name: Apply dashboard and revoked-token status repair
        run: node scripts/repair-dashboard-token-status.mjs
      - name: Apply payment WilliToken copy UI repair
        run: node scripts/repair-payment-willitoken-copy-ui.mjs
      - name: Apply payment/category/revocation lifecycle repair
        run: node scripts/repair-payment-category-and-revocation-v2.mjs
      - name: Apply paid-token redemption gate and final lifecycle repair
        run: node scripts/repair-paid-token-redeem-gate.mjs
      - name: Verify requested activation signup dashboard repairs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          activation = Path('app/dashboard/activation/page.tsx').read_text()
          signup = Path('app/signup/page.tsx').read_text()
          dashboard = Path('app/dashboard/page.tsx').read_text()
          admin = Path('app/admin/page.tsx').read_text()
          ai = Path('lib/aiAccess.ts').read_text()
          payment = Path('functions/activationPayments.js').read_text()
          assert 'Other countries' in activation
          assert 'Nigeria' in activation
          assert 'USD — US Dollar' in activation
          assert 'NGN — Nigerian Naira' in activation
          assert 'const [quote, setQuote]' in activation
          assert 'Coming soon' not in signup
          for category in ('Senior Secondary', 'Junior Secondary', 'Primary', 'Book Learner'):
              assert category in signup
          assert 'useState<string[]>([])' in signup
          assert 'lg:grid-cols-4' in dashboard
          assert "const nav=[{name:'QUIZ'" in dashboard
          assert 'max-w-md min-h-[150px]' in dashboard
          assert '<EducationFeed />' in dashboard
          assert 'no-active-willitoken' in ai
          assert 'function isUserActive(user: User, tokens: WilliToken[]): boolean' in admin
          assert 'activeWilliToken: null' in admin
          assert 'userDocId' in admin
          assert 'aria-label="Activation complete"' in activation
          assert 'WilliToken redeemed' in activation
          assert 'Unlocked categories' in activation
          assert 'copiedPaymentToken' in activation
          assert 'copyPaymentToken' in activation
          assert 'Your WilliToken' in activation
          assert "pendingActivationCode: code" in payment
          assert "used: false, redeemed: false, revoked: false, active: false, source: 'paystack'" in payment
          assert 'activeCategoryId: activeCategory' in activation
          print('Requested activation, signup, dashboard, entitlement, payment copy UI, token redemption gate, category assignment and revoke-status changes verified.')
          PY
      - name: Harden Admin WilliToken data handling
        run: node scripts/harden-admin-willitoken-data.mjs
      - name: Verify WilliToken physical cleanup
        run: |
          set -euxo pipefail
          grep -q "token.revoked === true" app/admin/page.tsx
          grep -q "token.cancelled === true" app/admin/page.tsx
          grep -q "deleteDoc(doc(db, 'williTokens', token.id))" app/admin/page.tsx
          echo "Revoked, cancelled and expired WilliToken deletion is present in the deployed Admin build."
      - name: Verify multi-book quiz isolation
        run: |
          set -euxo pipefail
          grep -q "evidenceByBook" lib/quizAiClientStable.ts
          grep -q "researchBooks(\[book\])" lib/quizAiClientStable.ts
          grep -q "const baseQuota" lib/quizAiClientStable.ts
          grep -q "local.length < share" lib/quizAiClientStable.ts
          echo "Multi-book evidence isolation and per-book quota checks passed."
      - name: Verify quiz resume cache
        run: |
          set -euxo pipefail
          grep -q "CACHE_VERSION = 'v23-grounded-generator-resume'" lib/quizAiClientStable.ts
          grep -q "writeGenerationCache" lib/quizAiClientStable.ts
          grep -q "onPartial" lib/quizAiClientStable.ts
          grep -q "clearGenerationCache" lib/quizAiClientStable.ts
          echo "Partial grounded-question caching and successful-completion cleanup verified."
      - name: Verify Quiz Studio dropdown implementation
        run: |
          set -euxo pipefail
          grep -q "function QuizDropdown" app/dashboard/quiz/page.tsx
          grep -q "slotOptions" app/dashboard/quiz/page.tsx
          grep -q "onChange={setDuration}" app/dashboard/quiz/page.tsx
          grep -q "onChange={setDifficulty}" app/dashboard/quiz/page.tsx
          echo "Quiz Studio dropdown implementation verified."
      - name: Typecheck
        run: npx tsc --noEmit --pretty false
      - name: Build application
        env:
          NEXT_PUBLIC_RECAPTCHA_ENTERPRISE_SITE_KEY: ${{ secrets.NEXT_PUBLIC_RECAPTCHA_ENTERPRISE_SITE_KEY }}
          NEXT_PUBLIC_PAYSTACK_PUBLIC_KEY: ${{ secrets.NEXT_PUBLIC_PAYSTACK_PUBLIC_KEY }}
        run: npm run build
      - name: Verify production artifact
        run: |
          set -euxo pipefail
          test -d out
          test -f out/index.html
          test -f out/dashboard/index.html
          test -f out/dashboard/activation/index.html
          test -f out/login/index.html
          test -f out/signup/index.html
          echo "Production Pages artifact verified."
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./out
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
