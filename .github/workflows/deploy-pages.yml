name: Deploy EDUWILLS to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  NEXT_PUBLIC_RECAPTCHA_ENTERPRISE_SITE_KEY: ${{ vars.NEXT_PUBLIC_RECAPTCHA_ENTERPRISE_SITE_KEY || secrets.NEXT_PUBLIC_RECAPTCHA_ENTERPRISE_SITE_KEY }}

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify application source
        run: |
          test -f app/dashboard/quiz/page.tsx
          test -f app/admin/page.tsx
          test -f lib/quizAiClient.ts
          test -f firestore.rules
          grep -q "Gen. Lucky Irabor" lib/quizAiClient.ts
          grep -q "Oyin Olugbile" lib/quizAiClient.ts
          grep -q "CACHE='v11-diverse-content'" lib/quizAiClient.ts
          grep -q "for(let attempt=1;attempt<=5;attempt++)" lib/quizAiClient.ts
          grep -q "deleteDoc" app/admin/page.tsx
          grep -q "allow delete: if isAdmin();" firestore.rules
          echo "Direct application changes verified."

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: npm run build

      - name: Verify Pages artifact
        run: |
          test -d out
          test -f out/index.html
          echo "Static Pages artifact created successfully."

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
