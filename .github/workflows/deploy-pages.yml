name: Deploy EDUWILLS to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  NEXT_PUBLIC_RECAPTCHA_ENTERPRISE_SITE_KEY: ${{ vars.NEXT_PUBLIC_RECAPTCHA_ENTERPRISE_SITE_KEY || secrets.NEXT_PUBLIC_RECAPTCHA_ENTERPRISE_SITE_KEY }}

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Prepare quiz runtime repair script
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/repair-quiz-runtime.mjs')
          s = p.read_text()
          s = s.replace('${', r'\${')
          p.write_text(s)
          PY

      - name: Apply quiz runtime repair
        run: node scripts/repair-quiz-runtime.mjs

      - name: Apply cross-device quiz cache and quota repair
        run: node scripts/repair-quiz-cache.mjs

     

      - name: Verify application source
        run: |
          set -e
          test -f app/dashboard/quiz/page.tsx
          test -f app/admin/page.tsx
          test -f lib/quizAiClient.ts
          test -f firestore.rules
          test -f scripts/repair-quiz-cache.mjs
          test -f scripts/repair-multi-provider-quiz.mjs
          grep -Fq "Gen. Lucky Irabor" lib/quizAiClient.ts
          grep -Fq "Oyin Olugbile" lib/quizAiClient.ts
          grep -Fq "while (accepted.length < requested" lib/quizAiClient.ts
          grep -Fq "instructionSatisfied" lib/quizAiClient.ts
          grep -Fq "QUIZ_POOL_TTL_MS" app/dashboard/quiz/page.tsx
          grep -Fq "DAILY_AI_GENERATIONS" app/dashboard/quiz/page.tsx
          grep -Fq "quizQuestionCache" app/dashboard/quiz/page.tsx
          grep -Fq "quizAiQuota" app/dashboard/quiz/page.tsx
          grep -Fq "generationTicker" app/dashboard/quiz/page.tsx
          grep -Fq "plainQuiz" lib/quizAiClient.ts
          grep -Fq "remoteAiBatch" lib/quizAiClient.ts
          grep -Fq "us-central1-eduwills.cloudfunctions.net/quizAiRouter" lib/quizAiClient.ts
          grep -Fq "allow delete: if isAdmin();" firestore.rules
          echo "EduWills quiz resilience, shared cache, quota and multi-provider routing verified."

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build static site
        run: npm run build

      - name: Verify Pages artifact
        run: |
          set -e
          test -d out
          test -f out/index.html
          echo "Static Pages artifact created successfully."

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
