name: Deploy EDUWILLS to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Apply dashboard Personal and news repair
        run: node scripts/repair-activation-news.mjs
      - name: Apply Primary JSS and SSS category home hardening
        run: node scripts/harden-category-home-pages.mjs
      - name: Apply activation success and WilliToken UI repair
        run: node scripts/repair-activation-success-ui.mjs
      - name: Apply dashboard and Admin token status repair
        run: node scripts/repair-dashboard-token-status.mjs
      - name: Apply payment WilliToken copy and redemption repair
        run: node scripts/repair-payment-willitoken-copy-ui.mjs
      - name: Apply payment category and revocation lifecycle repair
        run: node scripts/repair-payment-category-and-revocation-v2.mjs
      - name: Apply paid-token access gate repair
        run: node scripts/repair-paid-token-redeem-gate.mjs
      - name: Apply Admin WilliToken data hardening
        run: node scripts/harden-admin-willitoken-data.mjs
      - name: Apply category activation and image upload repair
        run: node scripts/repair-category-activation-upload.mjs
      - name: Apply community membership, search, image and message controls
        run: node scripts/implement-community-controls.mjs
      - name: Apply community controls v2
        run: node scripts/repair-community-controls-v2.mjs
      - name: Apply group unread/read-state hardening
        run: node scripts/harden-group-unread-state.mjs
      - name: Apply faster and more diverse quiz generator
        run: node scripts/upgrade-quiz-generator-v24.mjs
      - name: Harden quiz Gemini timeout and preserve gateway errors
        run: node scripts/harden-quiz-gemini-timeout.mjs
      - name: Apply parallel quiz batch generation
        run: node scripts/harden-quiz-parallel-generation.mjs
      - name: Apply quota-aware quiz provider
        run: node scripts/harden-quiz-quota-provider.mjs
      - name: Apply final quiz generation UX hardening
        run: node scripts/harden-quiz-generation-ux.mjs
      - name: Apply book quiz review and answer-key quality control
        run: node scripts/enhance-book-quiz-quality-and-review.mjs
      - name: Apply dedicated quiz generation failure repair
        run: node scripts/fix-quiz-generation-failure-ui.mjs

      - name: Verify repaired source
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          client = Path('lib/quizAiClientStable.ts').read_text()
          page = Path('app/dashboard/quiz/page.tsx').read_text()
          dashboard = Path('app/dashboard/page.tsx').read_text()
          category = Path('app/dashboard/category/page.tsx').read_text()
          backend = Path('workers/payments/src/index.js').read_text()
          upload = Path('components/DeviceImageUpload.tsx').read_text()
          activation = Path('app/dashboard/activation/page.tsx').read_text()
          community = Path('app/dashboard/community/page.tsx').read_text()
          community_group = Path('app/dashboard/community/group/page.tsx').read_text()
          community_chat = Path('app/dashboard/community/chat/page.tsx').read_text()
          rules = Path('firestore.rules').read_text()
          storage = Path('storage.rules').read_text()
          checks = {
              'dashboard primary navigation': all(x in dashboard for x in ('HOME', 'EXAM', 'QUIZ', 'COMMUNITY', 'MORE')),
              'category navigation': all(x in category for x in ('HOME', 'COMMUNITY', 'const homeActive =', 'const quizActive =')),
              'category education feed': '<EducationFeed />' in category,
              'gateway timeout helper': 'async function fetchWithTimeout' in client,
              'research fetch timeout': "fetchWithTimeout(url, { cache: 'no-store' }, 5000)" in client,
              'gateway config timeout': "fetchWithTimeout(`${BASE}/ai-gateway.json?v=30`, { cache: 'no-store' }, 5000)" in client,
              'batch concurrency': 'const QUIZ_BATCH_CONCURRENCY = 10;' in client,
              'batch size': 'const QUIZ_BATCH_SIZE = 10;' in client,
              'provider timeout': 'const QUIZ_PROVIDER_TIMEOUT = 15000;' in client,
              'adaptive grounded refill': 'generationTarget = Math.min(100' in client and 'refillRounds < 8' in client,
              'gateway-only generation': 'geminiText(' not in client and 'getGenerativeModel(' not in client and 'GoogleAIBackend' not in client,
              'no browser Gemini implementation': not re.search(r'\bgetAI\s*\(|\bGoogleAIBackend\b|\bgemini\.generateContent\s*\(|\bgeminiText\s*\(', client),
              'quota hardening version': "v33-quiz-reliable-generation" in client,
              'timer starts after generation': 'const readyAtMs = Date.now();' in page,
              'safe explanation parser': 'readableExplanation' in client and "value === '{}'" in client,
              'generation retry state': 'quizGenerationFailed' in page and 'Retry Generation' in page,
              'generation returns success': 'Promise<boolean>' in page and 'generatedSuccessfully' in page,
              'failed attempts excluded from free count': "data.status !== 'failed'" in page,
              'Firestore array category storage': 'arrayValue' in backend,
              'redeemed active category fields': 'activeCategoryId:categories[0]' in backend,
              'redeem supports array categories': 'f.categories?.arrayValue?.values' in backend,
              'resumable image upload': 'uploadBytesResumable' in upload and 'uploadBytesResumable(' in upload,
              'direct image upload fallback': 'uploadBytes(' in upload and 'uploadWithFallback' in upload,
              'image upload retry': 'attempt<=3' in upload,
              'chat image storage path': 'match /chatImages/{uid}/{fileName}' in storage,
              'community group membership state': 'isMember' in community_group and 'CLICK TO JOIN GROUP' in community_group,
              'community message lock UI': 'MESSAGE CONTROL' in community_group and 'messagingLocked' in community_group,
              'community suggested join button': 'CLICK TO JOIN GROUP' in community,
              'community chat search': 'publicUserIndex' in community_chat and 'Search by name or username' in community_chat,
              'community image upload': 'DeviceImageUpload' in community_chat,
              'recent chats include groups': "collection(db,'communityGroups')" in community_chat and 'groupRows' in community_chat,
              'recent chat unread tracking': 'lastReadAt' in community_chat and 'setUnread' in community_chat,
              'recent chat sender filtering': 'm.senderId!==user.uid' in community_chat,
              'group read state on open': 'setDoc(doc(db,\'communityGroups\',id,\'readState\',user.uid),{unread:0,lastReadAt:serverTimestamp()' in community_group,
              'community membership rule': 'memberIds.size() == resource.data.memberIds.size() + 1' in rules,
              'community lock rule': 'messagingLocked != true' in rules,
          }
          missing = [name for name, ok in checks.items() if not ok]
          if missing:
              print('Repair verification failed:')
              for item in missing:
                  print(' -', item)
              raise SystemExit(1)
          print(f'All repair, community-control, unread, upload and quiz/dashboard checks passed ({len(checks)} checks).')
          PY

      - name: Typecheck
        run: npx tsc --noEmit --pretty false

      - name: Build application
        env:
          NEXT_PUBLIC_RECAPTCHA_ENTERPRISE_SITE_KEY: ${{ secrets.NEXT_PUBLIC_RECAPTCHA_ENTERPRISE_SITE_KEY }}
          NEXT_PUBLIC_PAYSTACK_PUBLIC_KEY: ${{ secrets.NEXT_PUBLIC_PAYSTACK_PUBLIC_KEY }}
        run: npm run build

      - name: Verify production artifact
        run: |
          set -euo pipefail
          test -d out
          test -f out/index.html
          test -f out/dashboard/index.html
          test -f out/dashboard/activation/index.html
          test -f out/login/index.html
          test -f out/signup/index.html
          test -f out/dashboard/ai/index.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

# Repair scripts intentionally run in the build workspace; they no longer push from the Pages build job.
