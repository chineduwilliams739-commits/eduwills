name: Deploy EDUWILLS to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Verify dashboard navigation before repair scripts
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          dashboard = Path('app/dashboard/page.tsx').read_text()
          nav_labels = ('QUIZ', 'HISTORY', 'ACTIVATION', 'EDUWILLS AI', 'PERSONAL')
          missing = [label for label in nav_labels if label not in dashboard]
          if missing:
              print('Missing dashboard navigation labels:', ', '.join(missing))
              raise SystemExit(1)
          print('Dashboard navigation source verified:', ', '.join(nav_labels))
          PY
      - name: Apply dashboard Personal and news repair
        run: node scripts/repair-activation-news.mjs
      - name: Apply activation success and WilliToken UI repair
        run: node scripts/repair-activation-success-ui.mjs
      - name: Apply dashboard and Admin token status repair
        run: node scripts/repair-dashboard-token-status.mjs
      - name: Apply payment WilliToken copy and redemption repair
        run: node scripts/repair-payment-willitoken-copy-ui.mjs
      - name: Apply payment category and revocation lifecycle repair
        run: node scripts/repair-payment-category-and-revocation-v2.mjs
      - name: Apply paid-token access gate repair
        run: node scripts/repair-paid-token-redeem-gate.mjs
      - name: Apply final activation-page hardening
        run: node scripts/repair-activation-final.mjs
      - name: Apply Admin WilliToken data hardening
        run: node scripts/harden-admin-willitoken-data.mjs
      - name: Apply faster and more diverse quiz generator
        run: node scripts/upgrade-quiz-generator-v24.mjs
      - name: Re-apply dashboard Personal and news repair
        run: node scripts/repair-activation-news.mjs
      - name: Verify source repairs
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          def compact(text):
              return re.sub(r'\s+', '', text)

          activation = Path('app/dashboard/activation/page.tsx').read_text()
          signup = Path('app/signup/page.tsx').read_text()
          dashboard = Path('app/dashboard/page.tsx').read_text()
          admin = Path('app/admin/page.tsx').read_text()
          ai = Path('lib/aiAccess.ts').read_text()
          ai_page = Path('app/dashboard/ai/page.tsx').read_text()
          quiz_client = Path('lib/quizAiClientStable.ts').read_text()
          payment = Path('functions/activationPayments.js').read_text()
          dashboard_news_repair = Path('scripts/repair-activation-news.mjs').read_text()
          admin_hardening = Path('scripts/harden-admin-willitoken-data.mjs').read_text()
          quiz_script = Path('scripts/fix-quiz-studio-interactive-controls.mjs').read_text()
          quiz_upgrade = Path('scripts/upgrade-quiz-generator-v24.mjs').read_text()
          ca, cad, cp = compact(activation), compact(admin), compact(payment)
          layout_repair = dashboard_news_repair.replace('\\', '')

          checks = {
              'country options': 'Other countries' in activation and 'Nigeria' in activation,
              'currency options': 'USD — US Dollar' in activation and 'NGN — Nigerian Naira' in activation,
              'quote state': 'setQuote' in ca and 'quote' in ca,
              'activation success modal': 'aria-label="Activation complete"' in activation,
              'redeemed confirmation': 'WilliToken redeemed' in activation,
              'unlocked categories': 'Unlocked categories' in activation,
              'payment token display': 'Your WilliToken' in activation,
              'active category id': 'activeCategoryId' in activation,
              'copy payment token': 'copyPaymentToken' in ca,
              'copied payment token': 'copiedPaymentToken' in ca,
              'signup categories': all(x in signup for x in ('Senior Secondary', 'Junior Secondary', 'Primary', 'Book Learner')),
              'signup has phone selector': 'PhoneInput' in signup or 'country' in signup.lower(),
              'dashboard layout repair': 'lg:grid-cols-4' in layout_repair and "n==='PERSONAL'" in layout_repair and 'lg:col-span-4' in layout_repair,
              'dashboard inline news feed': 'function EducationFeed(){' in dashboard and '<EducationFeed />' in dashboard,
              'dashboard no external news feed import': "@/components/EducationFeed" not in dashboard,
              'dashboard support': '<ContactSupport />' in dashboard or 'ContactSupport' in dashboard,
              'paid-token access guard': 'no-active-willitoken' in ai,
              'AI general identity': 'CHINEDU WILLIAMS UCHENNA' in ai_page and 'not limited to books' in ai_page,
              'AI four categories': all(x in ai_page for x in ('Book Learner', 'Senior Secondary', 'Junior Secondary', 'Primary')),
              'AI ten per category': 'QUESTIONS_PER_CATEGORY = 10' in ai_page and 'usage[category]' in ai_page,
              'AI daily category reset': 'toISOString().slice(0, 10)' in ai_page and 'eduwills-ai-category-questions' in ai_page,
              'quiz reliable v25': "v25-grounded-reliable-generator" in quiz_client,
              'faster quiz model': "gemini-3.6-flash" in quiz_client,
              'quiz diversity rules': 'DIVERSITY RULE' in quiz_client and 'DISTRIBUTION RULE' in quiz_client,
              'admin active-status logic': 'isUserActive' in admin and 'return tokens.some' in admin,
              'admin status reconciliation': 'statusActive' in admin_hardening and "statusActive ? 'Active' : 'Inactive'" in admin_hardening,
              'admin cleanup': 'disposableTokens' in admin and 'disposableIds' in admin,
              'admin post-cleanup state': 'setTokens(liveTokens)' in admin_hardening,
              'payment pending activation code': 'pendingActivationCode' in cp,
              'payment source': "source:'paystack'" in cp or 'source:"paystack"' in cp,
              'payment token starts inactive': 'active:false' in cp,
              'activation redeems token as active': 'active:true' in ca,
              'payment redemption owner': 'redeemedBy:uid' in ca or 'redeemedBy:current.uid' in ca,
              'quiz repair is idempotent': 'already-fixed fragments were safely skipped' in quiz_script,
              'quiz upgrade script present': 'gemini-3.6-flash' in quiz_upgrade and 'DIVERSITY RULE' in quiz_upgrade,
          }

          missing = [name for name, ok in checks.items() if not ok]
          if 'Coming soon' in signup:
              missing.append('signup no Coming soon placeholder')
          if missing:
              print('Missing source checks:')
              for item in missing:
                  print(f' - {item}')
              raise SystemExit(1)
          print(f"EduWills source repairs verified ({len(checks)} implementation checks).")
          PY
      - name: Typecheck
        run: npx tsc --noEmit --pretty false
      - name: Build application
        env:
          NEXT_PUBLIC_RECAPTCHA_ENTERPRISE_SITE_KEY: ${{ secrets.NEXT_PUBLIC_RECAPTCHA_ENTERPRISE_SITE_KEY }}
          NEXT_PUBLIC_PAYSTACK_PUBLIC_KEY: ${{ secrets.NEXT_PUBLIC_PAYSTACK_PUBLIC_KEY }}
        run: npm run build
      - name: Verify production artifact
        run: |
          set -euo pipefail
          test -d out
          test -f out/index.html
          test -f out/dashboard/index.html
          test -f out/dashboard/activation/index.html
          test -f out/login/index.html
          test -f out/signup/index.html
          test -f out/dashboard/ai/index.html
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./out
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
