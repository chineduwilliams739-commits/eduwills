name: Deploy EDUWILLS to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Restore EDUWILLS homepage
        run: |
          set -euxo pipefail
          node --check scripts/restore-homepage-final.mjs
          node scripts/restore-homepage-final.mjs
      - name: Apply stable EDUWILLS implementation
        run: |
          set -euxo pipefail
          node --check scripts/implement-education-news-and-quiz-policy.mjs
          node scripts/implement-education-news-and-quiz-policy.mjs
          node --check scripts/publish-education-news.mjs
      - name: Apply safe Admin WilliToken implementation
        run: python3 scripts/apply-admin-willi-token-ui.py
      - name: Repair generated quiz client syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('lib/quizAiClientStable.ts')
          s = p.read_text(encoding='utf-8')
          s = s.replace(r'replace(/\\/$/, \'\')', r'replace(/\/$/, \'\')')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Apply quiz runtime reliability fix v8
        run: |
          set -euxo pipefail
          node --check scripts/fix-quiz-runtime-v8.mjs
          node scripts/fix-quiz-runtime-v8.mjs
      - name: Enforce isolated multi-book quiz grounding
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('lib/quizAiClientStable.ts')
          s = p.read_text(encoding='utf-8')

          old_evidence = "  const evidence = research || await researchBooks(books);\n  const output: QuizQuestion[] = [];"
          new_evidence = "  const evidence = research || await researchBooks(books);\n  const bookEvidence = await Promise.all(books.map((book) => researchBooks([book])));\n  const output: QuizQuestion[] = [];"
          if old_evidence not in s:
              raise SystemExit('Expected quiz evidence initialization not found')
          s = s.replace(old_evidence, new_evidence, 1)

          old_call = "        [...recent, ...output.map((question) => question.question)],\n        evidence,\n      );"
          new_call = "        [...recent, ...output.map((question) => question.question)],\n        bookEvidence[books.indexOf(book)] || evidence,\n      );"
          if old_call not in s:
              raise SystemExit('Expected quiz batch call not found')
          s = s.replace(old_call, new_call, 1)

          old_ground = "        if (!groundedForBooks([book], question, evidence)) continue;"
          new_ground = "        const localEvidence = bookEvidence[books.indexOf(book)] || evidence;\n        if (!groundedForBooks([book], question, localEvidence)) continue;"
          if old_ground not in s:
              raise SystemExit('Expected quiz grounding check not found')
          s = s.replace(old_ground, new_ground, 1)

          p.write_text(s, encoding='utf-8')
          PY
          npx tsc --noEmit --pretty false
      - name: Verify Quiz Studio dropdowns
        run: |
          set -euxo pipefail
          grep -q "function QuizDropdown" app/dashboard/quiz/page.tsx
          if grep -q '<select' app/dashboard/quiz/page.tsx; then
            echo 'Unexpected native select remains in Quiz Studio'
            exit 1
          fi
      - name: Verify stable quiz implementation
        run: |
          set -euxo pipefail
          test -f lib/quizAiClient.ts
          test -f lib/quizAiClientStable.ts
          test -f lib/verifiedBookGrounding.ts
          grep -q "quizAiClientStable" lib/quizAiClient.ts
          grep -q "Sànyà" lib/verifiedBookGrounding.ts
      - name: Typecheck
        run: npx tsc --noEmit --pretty false
      - name: Build application
        env:
          NEXT_PUBLIC_RECAPTCHA_ENTERPRISE_SITE_KEY: ${{ secrets.NEXT_PUBLIC_RECAPTCHA_ENTERPRISE_SITE_KEY }}
          NEXT_PUBLIC_PAYSTACK_PUBLIC_KEY: ${{ secrets.NEXT_PUBLIC_PAYSTACK_PUBLIC_KEY }}
        run: npm run build
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
        id: deployment
