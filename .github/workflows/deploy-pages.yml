name: Deploy EDUWILLS to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Clean previous build output
        run: rm -rf .next out
      - name: Verify repair scripts
        shell: bash
        run: |
          set -euxo pipefail
          test -f app/admin/page.tsx
          node --check scripts/repair-willi-token-lifecycle-v2.mjs
          node --check scripts/repair-willi-token-lifecycle-v4.mjs
          node --check scripts/repair-willi-token-runtime-v5.mjs
          node --check scripts/repair-willi-token-final-v6.mjs
          node --check scripts/repair-eduwills-multibook-ui-v1.mjs
          node --check scripts/repair-quiz-speed-v1.mjs
          node --check scripts/repair-quiz-cache-first-v2.mjs
      - name: Apply EDUWILLS final implementation
        shell: bash
        run: |
          set -euxo pipefail
          run_repair() {
            local script="$1"
            echo "========================================"
            echo "Running repair: $script"
            echo "========================================"
            node "$script"
          }
          run_repair scripts/repair-homepage-seo.mjs
          run_repair scripts/repair-quiz-grounding.mjs
          run_repair scripts/repair-ui-script-syntax.mjs
          run_repair scripts/repair-quiz-final-polish.mjs
          run_repair scripts/repair-quiz-final-behavior.mjs
          run_repair scripts/repair-quiz-admin-latest.mjs
          run_repair scripts/repair-willi-token-lifecycle-v2.mjs
          run_repair scripts/repair-willi-token-lifecycle-v4.mjs
          run_repair scripts/repair-willi-token-runtime-v5.mjs
          run_repair scripts/repair-willi-token-final-v6.mjs
          run_repair scripts/repair-willi-token-admin-final.mjs
          run_repair scripts/repair-quiz-grounding.mjs
          run_repair scripts/repair-quiz-instructions-result.mjs
          run_repair scripts/repair-eduwills-multibook-ui-v1.mjs
          run_repair scripts/repair-quiz-speed-v1.mjs
          run_repair scripts/repair-quiz-cache-first-v2.mjs
      - name: Verify final implementation before build
        shell: bash
        run: |
          set -euxo pipefail
          test -f lib/aiAccess.ts
          test -f app/dashboard/ai/page.tsx
          node --check scripts/repair-quiz-speed-v1.mjs
          node --check scripts/repair-quiz-cache-first-v2.mjs
          node - <<'NODE'
          const fs = require('fs');
          const admin = fs.readFileSync('app/admin/page.tsx', 'utf8');
          const ai = fs.readFileSync('app/dashboard/ai/page.tsx', 'utf8');
          const access = fs.readFileSync('lib/aiAccess.ts', 'utf8');
          const activation = fs.readFileSync('app/dashboard/activation/page.tsx', 'utf8');
          const quizClient = fs.readFileSync('lib/quizAiClient.ts', 'utf8');
          const dashboard = fs.readFileSync('app/dashboard/page.tsx', 'utf8');
          if (!admin.includes("const userTokens = (uid: string) =>")) throw new Error('Admin userTokens implementation missing');
          if (!admin.includes('getTime() > Date.now()')) throw new Error('Admin live expiry check missing');
          if (!admin.includes("deleteDoc(doc(db, 'williTokens'")) throw new Error('Admin expired-token deletion missing');
          if (!admin.includes('customDurationValue') || !admin.includes('customDurationUnit')) throw new Error('Custom WilliToken duration controls missing');
          if (!admin.includes("duration === 'custom'")) throw new Error('Custom duration generation path missing');
          if (!ai.includes("watchAiEntitlement")) throw new Error('AI is not using centralized entitlement service');
          if (!ai.includes("getAiEntitlement")) throw new Error('AI entitlement service is not wired into the page');
          if (!access.includes("activationStatus === 'active'")) throw new Error('AI account activation check missing');
          if (!access.includes('activationExpiresAt')) throw new Error('AI activation expiry check missing');
          if (!access.includes("where('uid', '==', uid)")) throw new Error('AI UID token fallback missing');
          if (!access.includes("where('userId', '==', uid)")) throw new Error('AI userId token fallback missing');
          if (!access.includes("where('username', '==', username)")) throw new Error('AI username token fallback missing');
          if (!activation.includes("activationStatus:'active'")) throw new Error('Activation status update missing');
          if (!activation.includes('activeWilliToken:clean')) throw new Error('Activation token linkage missing');
          if (!activation.includes('activationExpiresAt')) throw new Error('Activation expiry persistence missing');
          if (!activation.includes('eduwills-activation')) throw new Error('Activation visibility styling missing');
          if (!quizClient.includes('const allocations=books.map')) throw new Error('Multi-book quiz allocation missing');
          if (!quizClient.includes('CACHE-FIRST')) throw new Error('Cache-first quiz lookup missing');
          if (!quizClient.includes('await readSharedCache(key,recent)')) throw new Error('Per-book cache lookup missing');
          if (!quizClient.includes('STRICT BOOK SCOPE')) throw new Error('Strict per-book quiz grounding missing');
          if (!quizClient.includes('count <= 5 ? 24000 : 90000')) throw new Error('Small-quiz prompt optimization missing');
          if (!quizClient.includes('maxOutputTokens:5000')) throw new Error('Fast quiz output configuration missing');
          if (!dashboard.includes('EDUWILLS feed')) throw new Error('Dashboard learning feed missing');
          console.log('EDUWILLS cache-first quiz and activation visibility verification passed');
          NODE
      - name: Build application
        env:
          NEXT_PUBLIC_RECAPTCHA_ENTERPRISE_SITE_KEY: ${{ secrets.NEXT_PUBLIC_RECAPTCHA_ENTERPRISE_SITE_KEY }}
        run: npm run build
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
