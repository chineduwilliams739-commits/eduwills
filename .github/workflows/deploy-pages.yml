name: Deploy EDUWILLS to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Apply dashboard Personal and news repair
        run: node scripts/repair-activation-news.mjs
      - name: Apply activation success and WilliToken UI repair
        run: node scripts/repair-activation-success-ui.mjs
      - name: Apply dashboard and Admin token status repair
        run: node scripts/repair-dashboard-token-status.mjs
      - name: Apply payment WilliToken copy and redemption repair
        run: node scripts/repair-payment-willitoken-copy-ui.mjs
      - name: Apply payment category and revocation lifecycle repair
        run: node scripts/repair-payment-category-and-revocation-v2.mjs
      - name: Apply paid-token access gate repair
        run: node scripts/repair-paid-token-redeem-gate.mjs
      - name: Apply final activation-page hardening
        run: node scripts/repair-activation-final.mjs
      - name: Apply Admin WilliToken data hardening
        run: node scripts/harden-admin-willitoken-data.mjs
      - name: Verify source repairs
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          activation=Path('app/dashboard/activation/page.tsx').read_text()
          signup=Path('app/signup/page.tsx').read_text()
          dashboard=Path('app/dashboard/page.tsx').read_text()
          admin=Path('app/admin/page.tsx').read_text()
          ai=Path('lib/aiAccess.ts').read_text()
          payment=Path('functions/activationPayments.js').read_text()
          required_activation = [
              'Other countries','Nigeria','USD — US Dollar','NGN — Nigerian Naira',
              'const [quote, setQuote]','aria-label="Activation complete"',
              'WilliToken redeemed','Unlocked categories','Your WilliToken',
              'activeCategoryId','copyPaymentToken','copiedPaymentToken',
          ]
          for marker in required_activation: assert marker in activation, marker
          assert 'Coming soon' not in signup
          for category in ('Senior Secondary','Junior Secondary','Primary','Book Learner'): assert category in signup
          assert 'lg:grid-cols-4' in dashboard
          assert '<EducationFeed />' in dashboard
          assert 'no-active-willitoken' in ai
          assert 'function isUserActive(user: User, tokens: WilliToken[]): boolean' in admin
          assert 'activeWilliToken: null' in admin
          assert 'userDocId' in admin
          assert "pendingActivationCode: code" in payment
          assert "source: 'paystack'" in payment
          assert 'active: true' in payment
          assert 'redeemedBy: uid' in payment
          print('EduWills source repairs verified.')
          PY
      - name: Typecheck
        run: npx tsc --noEmit --pretty false
      - name: Build application
        env:
          NEXT_PUBLIC_RECAPTCHA_ENTERPRISE_SITE_KEY: ${{ secrets.NEXT_PUBLIC_RECAPTCHA_ENTERPRISE_SITE_KEY }}
          NEXT_PUBLIC_PAYSTACK_PUBLIC_KEY: ${{ secrets.NEXT_PUBLIC_PAYSTACK_PUBLIC_KEY }}
        run: npm run build
      - name: Verify production artifact
        run: |
          set -euo pipefail
          test -d out
          test -f out/index.html
          test -f out/dashboard/index.html
          test -f out/dashboard/activation/index.html
          test -f out/login/index.html
          test -f out/signup/index.html
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./out
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
