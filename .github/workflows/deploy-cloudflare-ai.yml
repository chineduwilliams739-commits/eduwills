name: Deploy EDUWILLS AI Gateway

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'cloudflare/**'
      - 'scripts/enable-gemini-search.mjs'
      - '.github/workflows/deploy-cloudflare-ai.yml'

permissions:
  contents: write
  actions: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Apply Gemini Search client bridge
        run: node scripts/enable-gemini-search.mjs

      - name: Validate Gemini Search client bridge
        run: git diff --check

      - name: Persist Gemini Search client bridge
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if git diff --quiet -- lib/quizAiClient.ts lib/quizAiClientStable.ts; then
            echo 'Gemini client bridge already applied.'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add lib/quizAiClient.ts lib/quizAiClientStable.ts
            git commit -m 'feat: route EDUWILLS research through Gemini Google Search'
            git push origin HEAD:main
          fi

      - name: Install dependencies
        working-directory: cloudflare
        run: npm install --no-audit --no-fund

      - name: Deploy Worker and publish URL
        working-directory: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing CLOUDFLARE_API_TOKEN'; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Missing CLOUDFLARE_ACCOUNT_ID'; exit 1; }
          test -n "$GROQ_API_KEY" || { echo 'Missing GROQ_API_KEY'; exit 1; }
          test -n "$OPENROUTER_API_KEY" || { echo 'Missing OPENROUTER_API_KEY'; exit 1; }
          test -n "$GEMINI_API_KEY" || { echo 'Missing GEMINI_API_KEY'; exit 1; }

          umask 077
          printf 'GROQ_API_KEY=%s\nOPENROUTER_API_KEY=%s\nGEMINI_API_KEY=%s\n' "$GROQ_API_KEY" "$OPENROUTER_API_KEY" "$GEMINI_API_KEY" > .env.production
          trap 'rm -f .env.production deploy.log' EXIT

          npx wrangler deploy --config wrangler.toml --secrets-file .env.production 2>&1 | tee deploy.log

          WORKER_URL="$(grep -Eo 'https://[^[:space:]]+workers\.dev' deploy.log | tail -1 | sed 's/[[:punct:]]*$//')"
          test -n "$WORKER_URL" || { echo 'Could not determine deployed Worker URL'; cat deploy.log; exit 1; }
          echo "Worker deployed at $WORKER_URL"

          CONTENT="$(printf '{\"url\":\"%s\"}\n' "$WORKER_URL" | base64 -w0)"
          SHA="$(gh api "repos/${GITHUB_REPOSITORY}/contents/public/ai-gateway.json" --jq '.sha')"
          gh api "repos/${GITHUB_REPOSITORY}/contents/public/ai-gateway.json" \
            --method PUT \
            -f message='Publish deployed AI gateway URL' \
            -f content="$CONTENT" \
            -f sha="$SHA" \
            -f branch='main' >/dev/null

      - name: Dispatch GitHub Pages deployment for the persisted client changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-pages.yml --ref main
