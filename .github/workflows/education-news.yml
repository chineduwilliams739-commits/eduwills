name: Refresh EDUWILLS Education News

on:
  schedule:
    - cron: '15 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: education-news
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Refresh education news
        run: node scripts/publish-education-news.mjs
      - name: Commit refreshed feed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/education-news.json
          if git diff --cached --quiet; then
            echo 'No education-news changes to commit.'
            exit 0
          fi
          git commit -m 'chore: refresh education news feed'
          git push
