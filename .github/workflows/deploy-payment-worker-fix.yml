name: Deploy EduWills Payment Worker Fix

on:
  push:
    branches: [main]
    paths:
      - 'workers/payments/.deploy-trigger'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Wrangler
        run: npm install -g wrangler
      - name: Authenticate Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: wrangler whoami
      - name: Configure payment worker secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PAYSTACK_SECRET_KEY: ${{ secrets.PAYSTACK_SECRET_KEY }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          BREVO_FROM_EMAIL: ${{ secrets.BREVO_FROM_EMAIL }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_EDUWILLS }}
        working-directory: workers/payments
        run: |
          set -euo pipefail
          test -n "$PAYSTACK_SECRET_KEY"
          test -n "$FIREBASE_SERVICE_ACCOUNT_JSON"
          printf '%s' "$PAYSTACK_SECRET_KEY" | wrangler secret put PAYSTACK_SECRET_KEY
          if [ -n "${BREVO_API_KEY:-}" ]; then printf '%s' "$BREVO_API_KEY" | wrangler secret put BREVO_API_KEY; fi
          if [ -n "${BREVO_FROM_EMAIL:-}" ]; then printf '%s' "$BREVO_FROM_EMAIL" | wrangler secret put BREVO_FROM_EMAIL; fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" | wrangler secret put FIREBASE_SERVICE_ACCOUNT_JSON
      - name: Deploy payment worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: workers/payments
        run: |
          set -euo pipefail
          wrangler deploy
          sleep 5
          curl --fail --silent --show-error --max-time 20 https://eduwills-payments.ginikauh.workers.dev/health || true
