name: Dispatch EDUWILLS Pages deployment

on:
  push:
    branches: [main]

permissions:
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      # Keep this workflow as the single push-to-Pages deployment bridge.
      - name: Dispatch Pages deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-pages.yml --ref main --repo "${{ github.repository }}"
