name: Fix Community Upgrade Script
on:
  push:
    branches: [main]
    paths:
      - 'scripts/fix-community-upgrade-script.mjs'
      - '.github/workflows/fix-community-upgrade-script.yml'
  workflow_dispatch:
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/fix-community-upgrade-script.mjs
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/upgrade-community-ux-v2.mjs
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Harden community upgrade script'
          git push
