name: Add EDUWILLS Image Moderation
on:
  push:
    branches: [main]
    paths:
      - 'scripts/add-image-moderation.mjs'
      - '.github/workflows/add-image-moderation.yml'
  workflow_dispatch:
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Apply moderation source
        run: node scripts/add-image-moderation.mjs
      - name: Commit moderation source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add functions/index.js functions/package.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Add server-side image moderation'
          git push
