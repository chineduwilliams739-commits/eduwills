name: Repair Community UI post-v6 syntax

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: community-ui-post-v6
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install v6 textarea guard
        run: node scripts/patch-community-v6-textarea-guard.mjs
      - name: Apply post-v6 Community syntax repair
        run: node scripts/fix-community-ui-v6-post.mjs
      - name: Commit repaired Community source and repair script
        run: |
          set -euo pipefail
          if git diff --quiet -- app/dashboard/community/group/page.tsx scripts/repair-community-ui-v6.mjs; then
            echo 'No Community repair change required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/dashboard/community/group/page.tsx scripts/repair-community-ui-v6.mjs
          git commit -m 'Harden Community v6 textarea repair'
          git push origin HEAD:main
