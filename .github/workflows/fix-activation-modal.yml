name: Fix Activation Modal JSX

on:
  push:
    branches: [main]
    paths:
      - 'scripts/.activation-modal-trigger'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply modal repair
        run: python3 scripts/fix-activation-modal.py
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit --pretty false
      - name: Commit modal repair
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/dashboard/activation/page.tsx components/ActivationSuccessModal.tsx
          if git diff --cached --quiet; then echo 'No modal changes.'; else git commit -m 'Repair activation success modal JSX'; git push origin HEAD:main; fi
