name: Repair Book Search

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair quiz book search and instruction grounding
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          # Patch the page without replacing the file. This is deliberately string-based
          # so a future page change cannot accidentally truncate the component.
          page = Path('app/dashboard/quiz/page.tsx')
          p = page.read_text()
          if '  searchBookAuthors,\n' not in p:
              needle = '  researchBooks,\n'
              if needle not in p:
                  raise SystemExit('quiz page import block not found')
              p = p.replace(needle, needle + '  searchBookAuthors,\n', 1)

          if "title: 'The Lekki Headmaster'" not in p:
              marker = "const CURATED_BOOKS: CuratedBook[] = [\n"
              entry = "  {\n    title: 'The Lekki Headmaster',\n    aliases: ['lekki headmaster', 'the lekki headmaster', 'lekki headmaster kabir alabi garba'],\n    authors: ['Kabir Alabi Garba'],\n  },\n"
              if marker not in p:
                  raise SystemExit('curated books marker not found')
              p = p.replace(marker, marker + entry, 1)

          start = p.find('  async function findBook() {')
          end = p.find('  async function saveBook() {', start)
          if start < 0 or end < 0:
              raise SystemExit('quiz book search functions not found')

          replacement = r'''  async function findBook() {
    const raw = title.trim();
    if (!raw) return;

    setSearching(true);
    setMessage('');
    setAuthors([]);
    setAuthor('');
    setAuthorQuery('');

    try {
      const results = await searchBookAuthors('title', raw);
      const normalizedQuery = normalize(raw);
      const curated = CURATED_BOOKS
        .filter((book) => [book.title, ...book.aliases].some((alias) => {
          const n = normalize(alias);
          return n.includes(normalizedQuery) || normalizedQuery.includes(n);
        }))
        .flatMap((book) => book.authors);

      const names = Array.from(new Set([
        ...curated,
        ...results.flatMap((result) => result.authors),
      ].filter(Boolean))).slice(0, 80);

      setAuthors(names);
      setMessage(
        names.length
          ? 'Select a verified author from the search results. Authors cannot be entered manually.'
          : 'No verified author was found. Try the full title or search for the author by name.'
      );
    } catch (error) {
      console.error('Book search failed', error);
      setMessage('Book search is temporarily unavailable. Please try again.');
    } finally {
      setSearching(false);
    }
  }

  async function searchAuthor() {
    const q = authorQuery.trim();
    if (!q) return;

    setSearching(true);
    setMessage('');
    try {
      const results = await searchBookAuthors('author', q);
      const names = Array.from(new Set(
        results.flatMap((result) => result.authors).filter(Boolean)
      )).slice(0, 80);
      setAuthors(names);
      setMessage(
        names.length
          ? 'Select a verified author from the search results.'
          : 'No verified author match was found. Try another spelling.'
      );
    } catch (error) {
      console.error('Author search failed', error);
      setMessage('Author search is temporarily unavailable. Please try again.');
    } finally {
      setSearching(false);
    }
  }

'''
          p = p[:start] + replacement + p[end:]
          page.write_text(p)

          # Patch the stable search helper safely.
          stable = Path('lib/quizAiClientStable.ts')
          s = stable.read_text()
          start = s.find("export async function searchBookAuthors(kind: 'title' | 'author', value: string): Promise<BookSearchResult[]> {")
          end = s.find('\n\nexport async function researchBooks', start)
          if start < 0 or end < 0:
              raise SystemExit('stable searchBookAuthors function not found')

          helper = r'''export async function searchBookAuthors(kind: 'title' | 'author', value: string): Promise<BookSearchResult[]> {
  const query = value.trim();
  if (!query) return [];
  const encoded = encodeURIComponent(query);
  const urls = kind === 'title'
    ? [
        `https://openlibrary.org/search.json?title=${encoded}&limit=50&fields=title,author_name,key`,
        `https://www.googleapis.com/books/v1/volumes?q=intitle:${encoded}&maxResults=40`,
        `https://archive.org/advancedsearch.php?q=title:(${encoded})&fl[]=title&fl[]=creator&rows=40&page=1&output=json`,
      ]
    : [
        `https://openlibrary.org/search.json?author=${encoded}&limit=50&fields=title,author_name,key`,
        `https://www.googleapis.com/books/v1/volumes?q=inauthor:${encoded}&maxResults=40`,
        `https://archive.org/advancedsearch.php?q=creator:(${encoded})&fl[]=title&fl[]=creator&rows=40&page=1&output=json`,
      ];

  const output: BookSearchResult[] = [];
  const seen = new Set<string>();

  await Promise.allSettled(urls.map(async (url) => {
    try {
      const response = await fetch(url, { cache: 'no-store' });
      if (!response.ok) return;
      const data: any = await response.json();
      const rows = [
        ...(data.docs || []),
        ...(data.items || []).map((item: any) => ({
          title: item.volumeInfo?.title,
          author_name: item.volumeInfo?.authors,
        })),
        ...(data.response?.docs || []),
      ];

      for (const row of rows) {
        const title = clean(row?.title);
        const rawAuthors = row?.author_name ?? row?.authors ?? row?.creator ?? row?.author;
        const authors = Array.isArray(rawAuthors)
          ? rawAuthors.map((x: unknown) => clean(x)).filter(Boolean)
          : typeof rawAuthors === 'string'
            ? rawAuthors.split(/;|,|\|/).map(clean).filter(Boolean)
            : [];
        if (!title || !authors.length) continue;
        const key = `${norm(title)}|${authors.map(norm).join('|')}`;
        if (seen.has(key)) continue;
        seen.add(key);
        output.push({
          title,
          authors,
          source: url.includes('openlibrary')
            ? 'Open Library'
            : url.includes('googleapis')
              ? 'Google Books'
              : 'Internet Archive',
        });
      }
    } catch {}
  }));

  return output.slice(0, 160);
}
'''
          s = s[:start] + helper + s[end:]

          # Add Internet Archive to exact-book research while retaining the existing
          # verified-book layer as authoritative.
          old = """      `https://openlibrary.org/search.json?title=${title}&author=${author}&limit=30&fields=title,author_name,first_sentence,subject,description,first_publish_year,publisher`,\n    ];"""
          new = """      `https://openlibrary.org/search.json?title=${title}&author=${author}&limit=30&fields=title,author_name,first_sentence,subject,description,first_publish_year,publisher`,\n      `https://archive.org/advancedsearch.php?q=title:(${title})%20AND%20creator:(${author})&fl[]=title&fl[]=creator&fl[]=description&fl[]=subject&rows=20&page=1&output=json`,\n    ];"""
          if old in s and 'archive.org/advancedsearch.php?q=title:(${title})' not in s:
              s = s.replace(old, new, 1)

          # Make user instructions explicit and mandatory; empty instructions trigger
          # broad book-content coverage instead of a narrow repeated question type.
          old_prompt = "USER INSTRUCTIONS: ${instructions || 'Create a diverse quiz from the actual book content.'}"
          new_prompt = "USER INSTRUCTIONS: ${instructions ? `MANDATORY — follow these instructions in every question after factual accuracy and safety: ${instructions}. Each question must visibly reflect the requested focus; do not replace it with a generic question.` : 'No special instructions were provided. Deliberately vary questions across characters, relationships, events, chronology, settings, causes/consequences, themes, conflicts, language/style, symbols, decisions, chapters, and distinctive book-specific details.'}"
          if old_prompt in s:
              s = s.replace(old_prompt, new_prompt, 1)
          stable.write_text(s)
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/dashboard/quiz/page.tsx lib/quizAiClientStable.ts
          if git diff --cached --quiet; then
            echo 'No repair changes needed.'
            exit 0
          fi
          git commit -m 'fix: reliable book and author search plus instruction grounding [skip ci]'
          git push
