name: Repair EduWills dashboard session

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Escape nested repair-script template expressions
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/repair-dashboard-session.mjs')
          text = path.read_text()
          replacements = {
              '${source?.title || \'Source\'}': r'\${source?.title || \'Source\'}',
              '${source?.url || \'\'}': r'\${source?.url || \'\'}',
          }
          for old, new in replacements.items():
              text = text.replace(old, new)
          path.write_text(text)
          PY
          node --check scripts/repair-dashboard-session.mjs
      - name: Apply session, activation, and quiz search repair
        run: |
          set -euxo pipefail
          node scripts/repair-dashboard-session.mjs
      - name: Commit repair if needed
        run: |
          set -euxo pipefail
          if git diff --quiet; then
            echo 'No repair changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/dashboard/page.tsx app/dashboard/activation/page.tsx app/dashboard/quiz/page.tsx lib/quizAiClientStable.ts scripts/repair-dashboard-session.mjs .github/workflows/repair-dashboard-session.yml
          git commit -m 'Repair dashboard and quiz search support'
          git push
