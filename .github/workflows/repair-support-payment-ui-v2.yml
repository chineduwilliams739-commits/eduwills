name: Apply support and payment UI v2

on:
  push:
    branches: [main]
    paths:
      - 'scripts/repair-support-payment-ui-v2.mjs'
      - '.github/workflows/repair-support-payment-ui-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply repair
        run: node scripts/repair-support-payment-ui-v2.mjs
      - name: Verify repair
        run: |
          grep -q "ContactSupport from '@/components/ContactSupport'" app/dashboard/page.tsx
          grep -q '<ContactSupport />' app/dashboard/page.tsx
          grep -q "ContactSupport from '@/components/ContactSupport'" app/dashboard/personal/page.tsx
          grep -q '<ContactSupport />' app/dashboard/personal/page.tsx
          grep -q 'paymentSuccess' app/dashboard/activation/page.tsx
          grep -q 'PAYMENT_ACTIVATION_UI_AND_DELIVERY_REPAIR_V2' workers/payments/src/index.js
          grep -q 'code:result.code' workers/payments/src/index.js
      - name: Commit repaired files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/dashboard/page.tsx app/dashboard/personal/page.tsx app/dashboard/activation/page.tsx workers/payments/src/index.js
          if git diff --cached --quiet; then
            echo 'No changes needed.'
          else
            git commit -m 'Restore support controls and payment success popup'
            git push
          fi
